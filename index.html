<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Reading & Math</title>
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3352;--accent:#5b7ff5;--success:#3dba7a;--warning:#f5a623;--danger:#e85d5d;--text:#e8eaf0;--text2:#8b92b3;--r:12px;--rs:8px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;}
#app{max-width:1060px;margin:0 auto;padding:16px 14px 60px;}
h1{font-size:1.7rem;font-weight:700;}h2{font-size:1.3rem;font-weight:600;}h3{font-size:1.05rem;font-weight:600;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:14px;}
.card-sm{padding:14px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border:none;border-radius:var(--rs);font-size:.95rem;font-weight:600;cursor:pointer;transition:opacity .15s,transform .1s;}
.btn:hover{opacity:.88;}.btn:active{transform:scale(.97);}.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-primary{background:var(--accent);color:#fff;}.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.btn-success{background:var(--success);color:#fff;}.btn-warning{background:var(--warning);color:#000;}.btn-full{width:100%;}.btn-lg{padding:14px 28px;font-size:1rem;}
.row{display:flex;gap:10px;flex-wrap:wrap;}.row>*{flex:1;min-width:120px;}
label{display:block;font-size:.82rem;color:var(--text2);margin-bottom:5px;font-weight:500;}
input[type="text"],input[type="password"],textarea{width:100%;padding:9px 13px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-size:.95rem;outline:none;transition:border-color .15s;}
input:focus,textarea:focus{border-color:var(--accent);}
textarea{resize:vertical;font-family:inherit;}
input[type="number"]{width:80px;padding:7px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-size:.95rem;outline:none;}
input[type="range"]{width:100%;accent-color:var(--accent);}
.tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:.75rem;font-weight:600;background:var(--surface2);border:1px solid var(--border);}
.tag-accent{background:rgba(91,127,245,.18);border-color:var(--accent);color:var(--accent);}
.tag-success{background:rgba(61,186,122,.15);border-color:var(--success);color:var(--success);}
.divider{border:none;border-top:1px solid var(--border);margin:16px 0;}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-center{text-align:center;padding:60px 20px;}
.loading-center p{margin-top:14px;color:var(--text2);}
/* Story */
.story-text{font-size:1rem;line-height:1.9;white-space:pre-wrap;}
.story-panel{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;overflow-y:auto;}
/* Questions two-col layout */
.q-layout{display:grid;grid-template-columns:45% 1fr;gap:14px;align-items:start;}
.q-story-col{position:sticky;top:14px;display:flex;flex-direction:column;gap:8px;}
.q-story-col .story-panel{overflow-y:auto;height:calc(100vh - 160px);min-height:400px;}
@media(max-width:740px){
  .q-layout{grid-template-columns:1fr;}
  .q-story-col{position:static;}
  .q-story-col .story-panel{height:260px;min-height:200px;}
}
/* Hints / answers */
.hint-box{background:rgba(245,166,35,.08);border:1px solid rgba(245,166,35,.3);border-radius:var(--rs);padding:12px 14px;margin-top:10px;font-size:.93rem;}
.answer-box{background:rgba(61,186,122,.08);border:1px solid rgba(61,186,122,.3);border-radius:var(--rs);padding:12px 14px;margin-top:10px;font-size:.93rem;}
.error-box{background:rgba(232,93,93,.1);border:1px solid rgba(232,93,93,.3);border-radius:var(--rs);padding:12px 14px;margin-top:10px;}
/* Wrong attempt display */
.wrong-attempt{background:rgba(232,93,93,.07);border:1px solid rgba(232,93,93,.25);border-radius:var(--rs);padding:9px 13px;margin-top:8px;font-size:.88rem;}
.wrong-attempt-label{font-size:.72rem;font-weight:700;color:var(--danger);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;}
/* Progress dots */
.q-dots{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.q-dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;cursor:pointer;transition:transform .1s;}
.q-dot:hover{transform:scale(1.1);}
.q-dot-correct{background:var(--success);color:#fff;}
.q-dot-wrong{background:var(--danger);color:#fff;}
.q-dot-current{background:var(--accent);color:#fff;box-shadow:0 0 0 3px rgba(91,127,245,.35);}
.q-dot-upcoming{background:var(--surface2);color:var(--text2);border:1px solid var(--border);}
.q-review-popup{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-top:8px;font-size:.87rem;}
.correct-tag{color:var(--success);font-weight:700;font-size:.76rem;}
.wrong-tag{color:var(--danger);font-weight:700;font-size:.76rem;}
/* Clarify */
.clarify-section{margin-top:14px;border-top:1px solid var(--border);padding-top:12px;}
.clarify-toggle{color:var(--accent);font-size:.84rem;cursor:pointer;text-decoration:underline;background:none;border:none;padding:0;}
.clarify-form{margin-top:8px;display:flex;gap:8px;}
.clarify-form textarea{min-height:46px;}
.clarify-response{background:rgba(91,127,245,.08);border:1px solid rgba(91,127,245,.2);border-radius:var(--rs);padding:10px 12px;margin-top:8px;font-size:.9rem;}
/* Parent review */
.pr-field{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
.pr-field:last-child{border-bottom:none;}
.pr-field label{margin:0;min-width:170px;font-size:.92rem;color:var(--text);}
.level-announce{padding:10px 14px;margin:6px 0;background:rgba(61,186,122,.1);border:1px solid rgba(61,186,122,.3);border-radius:var(--rs);color:var(--success);font-weight:600;}
/* Child switcher */
.child-switcher{display:flex;border-radius:var(--rs);overflow:hidden;border:1px solid var(--border);width:fit-content;}
.child-tab{padding:7px 22px;cursor:pointer;font-weight:600;font-size:.9rem;background:var(--surface2);color:var(--text2);border:none;transition:background .15s,color .15s;}
.child-tab.active{background:var(--accent);color:#fff;}
/* Option buttons */
.option-btn{display:block;width:100%;text-align:left;padding:14px 18px;margin-bottom:10px;background:var(--surface2);border:2px solid var(--border);border-radius:var(--r);cursor:pointer;color:var(--text);font-size:.95rem;transition:border-color .15s,background .15s;}
.option-btn:hover{border-color:var(--accent);background:rgba(91,127,245,.06);}
/* Gamification */
.points-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;background:rgba(245,166,35,.15);border:1px solid rgba(245,166,35,.3);border-radius:20px;font-size:.82rem;font-weight:700;color:var(--warning);cursor:pointer;}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px;}
.badge-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:12px;text-align:center;}
.badge-card.earned{border-color:var(--warning);background:rgba(245,166,35,.08);}
.badge-card.locked{opacity:.42;}
.badge-icon{font-size:1.8rem;margin-bottom:4px;}
.badge-name{font-size:.76rem;font-weight:600;line-height:1.3;}
.badge-desc{font-size:.68rem;color:var(--text2);margin-top:3px;line-height:1.3;}
.store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;margin-top:12px;}
.store-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:14px;text-align:center;}
.store-card.owned{border-color:var(--success);}
.store-price{font-size:.8rem;color:var(--warning);font-weight:700;margin-top:6px;}
.store-name{font-size:.88rem;font-weight:600;}
.store-desc{font-size:.72rem;color:var(--text2);margin-top:3px;line-height:1.3;}
.top-nav{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.top-nav-right{margin-left:auto;display:flex;gap:8px;align-items:center;}
.history-session{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:14px;margin-bottom:10px;}
.history-q{padding:8px 0;border-bottom:1px solid var(--border);font-size:.87rem;}
.history-q:last-child{border-bottom:none;}
.score-big{font-size:2.8rem;font-weight:800;text-align:center;color:var(--accent);line-height:1;}
.pts-earned{font-size:1.1rem;color:var(--warning);font-weight:700;text-align:center;margin-top:4px;}
.api-key-note{font-size:.78rem;color:var(--text2);margin-top:5px;}
/* Multiple choice */
.choices-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px;}
.choice-btn{padding:13px 14px;border:2px solid var(--border);border-radius:var(--rs);background:var(--surface2);color:var(--text);font-size:.9rem;cursor:pointer;text-align:left;line-height:1.4;transition:border-color .15s,background .15s;}
.choice-btn:hover:not(:disabled){border-color:var(--accent);background:rgba(91,127,245,.08);}
.choice-btn:disabled{cursor:default;}
.choice-btn.choice-wrong{border-color:var(--danger) !important;background:rgba(232,93,93,.08);opacity:.65;}
@media(max-width:500px){.choices-grid{grid-template-columns:1fr;}}
/* Parent override */
.parent-override-btn{display:inline-block;margin-top:12px;padding:5px 11px;font-size:.72rem;color:var(--text2);background:none;border:1px solid var(--border);border-radius:var(--rs);cursor:pointer;}
.parent-override-btn:hover{border-color:var(--warning);color:var(--warning);}
/* Correct-answer celebration */
.correct-celebrate{background:linear-gradient(135deg,rgba(61,186,122,.15),rgba(91,127,245,.08));border:2px solid var(--success);border-radius:var(--r);padding:28px 20px;text-align:center;animation:cel-in .3s ease;}
@keyframes cel-in{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:scale(1);}}
.celebrate-check{font-size:3rem;line-height:1;margin-bottom:8px;}
.celebrate-pts{font-size:2rem;font-weight:800;color:var(--success);}
.celebrate-bonus{font-size:1.1rem;color:var(--warning);font-weight:700;margin-top:2px;}
.celebrate-sub{color:var(--text2);font-size:.88rem;margin-top:8px;}
/* Floating trail particles */
@keyframes particle-rise{0%{opacity:1;transform:translate(0,0) scale(1);}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(.4);}}
.trail-particle{position:fixed;pointer-events:none;z-index:9999;font-size:1.6rem;animation:particle-rise 1.1s ease-out forwards;}
/* Avatar */
.avatar-wrap{display:inline-block;filter:drop-shadow(0 6px 16px rgba(0,0,0,.5));}
.equip-slot-label{font-size:.72rem;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 5px;}
.equip-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:4px;}
.equip-chip{display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:20px;font-size:.8rem;font-weight:600;border:2px solid var(--border);background:var(--surface2);cursor:pointer;transition:border-color .12s,background .12s;}
.equip-chip:hover{border-color:var(--accent);}
.equip-chip.active{border-color:var(--accent);background:rgba(91,127,245,.12);}
.equip-chip.locked{opacity:.45;cursor:default;}
/* Themes switcher */
.theme-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.theme-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;font-size:.82rem;font-weight:600;border:2px solid var(--border);background:var(--surface2);cursor:pointer;transition:border-color .12s;}
.theme-chip.active{border-color:var(--accent);}
.theme-chip.locked{opacity:.42;cursor:default;}
.theme-swatch{width:14px;height:14px;border-radius:50%;flex-shrink:0;}
/* Dramatic theme body classes */
body.th-hacker{background-image:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,230,118,.018) 3px,rgba(0,230,118,.018) 4px);}
body.th-space{background-image:radial-gradient(1px 1px at 22% 18%,rgba(255,255,255,.45),transparent),radial-gradient(1px 1px at 68% 8%,rgba(255,255,255,.35),transparent),radial-gradient(1px 1px at 40% 55%,rgba(255,255,255,.3),transparent),radial-gradient(1px 1px at 85% 40%,rgba(255,255,255,.4),transparent),radial-gradient(1px 1px at 12% 70%,rgba(255,255,255,.35),transparent);}
body.th-ocean::before{content:'';position:fixed;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.3;pointer-events:none;}
.session-hdr{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
.mt4{margin-top:4px;}.mt8{margin-top:8px;}.mt10{margin-top:10px;}.mt12{margin-top:12px;}.mt16{margin-top:16px;}.mt20{margin-top:20px;}
.mb4{margin-bottom:4px;}.mb8{margin-bottom:8px;}.mb10{margin-bottom:10px;}.mb12{margin-bottom:12px;}.mb16{margin-bottom:16px;}
.text-muted{color:var(--text2);}.text-sm{font-size:.85rem;}.text-xs{font-size:.75rem;}
.text-success{color:var(--success);}.text-danger{color:var(--danger);}.text-warning{color:var(--warning);}.text-accent{color:var(--accent);}
.bold{font-weight:700;}.text-center{text-align:center;}
.history-story{font-size:.83rem;line-height:1.6;margin-top:10px;max-height:380px;overflow-y:auto;padding:10px 12px;background:var(--bg);border-radius:var(--rs);border:1px solid var(--border);}
.history-story-toggle{cursor:pointer;font-size:.78rem;color:var(--accent);margin-top:8px;list-style:none;user-select:none;}
.history-story-toggle::marker{display:none;}
.pin-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:999;display:flex;align-items:center;justify-content:center;}
.pin-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:28px 24px;width:min(320px,90vw);display:flex;flex-direction:column;gap:12px;}
.pin-box h3{margin:0;font-size:1rem;}
.pin-box input{font-size:1.2rem;letter-spacing:4px;text-align:center;padding:10px;}
.pin-box .row{display:flex;gap:8px;justify-content:flex-end;}
.fact-pick-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px;}
@media(max-width:500px){.fact-pick-grid{grid-template-columns:1fr;}}
.fact-pick-card{padding:22px 16px;border:2px solid var(--border);border-radius:var(--r);background:var(--surface2);cursor:pointer;text-align:center;transition:border-color .18s,transform .12s,background .18s;width:100%;}
.fact-pick-card:hover{border-color:var(--accent);background:rgba(91,127,245,.07);transform:translateY(-2px);}
.fact-pick-icon{font-size:2.4rem;margin-bottom:8px;}
.fact-pick-name{font-size:1rem;font-weight:700;margin-bottom:5px;}
.fact-pick-examples{font-size:.78rem;color:var(--text2);line-height:1.4;}
.flip-cards{display:flex;flex-direction:column;gap:12px;margin:20px 0;}
.flip-card{perspective:900px;}
.flip-card-inner{position:relative;width:100%;min-height:88px;transition:transform .65s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d;}
.flip-card.flipped .flip-card-inner{transform:rotateX(180deg);}
.flip-card-front,.flip-card-back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--rs);padding:16px 18px;display:flex;align-items:center;justify-content:center;}
.flip-card-front{background:var(--surface2);border:1px solid var(--border);color:var(--text2);font-size:.9rem;}
.flip-card-back{background:var(--surface2);border:1px solid var(--accent);transform:rotateX(180deg);flex-direction:column;align-items:flex-start;justify-content:flex-start;padding-top:14px;}
.flip-fact-label{font-size:.68rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
.flip-fact-text{font-size:.9rem;line-height:1.45;}
</style>
</head>
<body>
<div id="app"></div>
<div id="pinOverlay" style="display:none;"></div>
<script>
'use strict';

// ─── Profiles ─────────────────────────────────────────────────────────────────
const PROFILES = {
  gio:{id:'gio',name:'Gio',storageKey:'gio_session_state_v1',age:11,grade:'6th',startReadingLevel:6.0,startMathLevel:6.0,defaultStoryWords:800,sentenceComplexity:'normal-to-rich sentences for an 11-year-old — varied length, descriptive, no need to simplify',mathDomains:['Fractions','Measurement and Data','Fractions','Measurement and Data','Algebra','Geometry'],numQuestions:5,interests:['football','Fortnite']},
  valentino:{id:'valentino',name:'Valentino',storageKey:'valentino_session_state_v1',age:9,grade:'4th',startReadingLevel:4.0,startMathLevel:4.0,defaultStoryWords:700,sentenceComplexity:'short, clean sentences — simple words, one idea per sentence, easy for a 9-year-old',mathDomains:['Fractions','Measurement and Data','Algebra','Geometry','Fractions','Measurement and Data'],numQuestions:5,interests:['Mario','Super Smash Bros','Fortnite','Roblox','Minecraft']},
  leah:{id:'leah',name:'Leah',storageKey:'leah_session_state_v1',age:9,grade:'4th',startReadingLevel:4.0,startMathLevel:4.0,defaultStoryWords:700,sentenceComplexity:'short, clean sentences — simple words, one idea per sentence, easy for a 9-year-old',mathDomains:['Fractions','Measurement and Data','Algebra','Geometry','Fractions','Measurement and Data'],numQuestions:5,interests:['stuffed animals','dog rescue centers','animals'],pin:'12345678'},
};

const ALL_BADGES = [
  // ── Story formats ──
  {id:'detective_rookie',icon:'🔍',name:'Detective Rookie',desc:'Complete 3 Detective stories',check:(st)=>(st.detectiveCount||0)>=3},
  {id:'master_detective',icon:'🕵️',name:'Master Detective',desc:'Complete 10 Detective stories',check:(st)=>(st.detectiveCount||0)>=10},
  {id:'path_finder',icon:'🗺️',name:'Path Finder',desc:'Complete 3 Choose-Your-Path stories',check:(st)=>(st.cypCount||0)>=3},
  {id:'choice_master',icon:'⚡',name:'Choice Master',desc:'Complete 10 Choose-Your-Path stories',check:(st)=>(st.cypCount||0)>=10},
  // ── Streaks & consistency ──

  {id:'double_session',icon:'🔥',name:'Double Session',desc:'Complete 2 sessions in one day',check:(st)=>(st.sessionsCompletedToday||0)>=2},

  {id:'sharpshooter',icon:'🏹',name:'Sharpshooter',desc:'5 perfect sessions total',check:(st)=>(st.perfectSessions||0)>=5},
  {id:'hint_free_streak',icon:'🧠',name:'Pure Instinct',desc:'5 sessions completed with zero hints',check:(st)=>(st.sessionNoHintCount||0)>=5},
  {id:'sharp_mind',icon:'💡',name:'Sharp Mind',desc:'3 perfect sessions in a row',check:(st)=>(st.consecutivePerfect||0)>=3},
  {id:'first_try_10',icon:'🎯',name:'First Try',desc:'10 sessions with perfect score and no hints',check:(st)=>(st.perfectSessions||0)>=10},
  // ── Math ──
  {id:'math_up',icon:'🧮',name:'Math Level Up',desc:'Reach a new math level',check:(st,sess)=>sess&&sess.mathLevelUp},
  {id:'fractions_ace',icon:'🍕',name:'Fractions Ace',desc:'5 Fractions sessions',check:(st)=>(st.domainCounts?.Fractions||0)>=5},
  {id:'data_ace',icon:'📊',name:'Data Detective',desc:'5 Measurement & Data sessions',check:(st)=>(st.domainCounts?.['Measurement and Data']||0)>=5},
  {id:'algebra_ace',icon:'➕',name:'Algebra Ace',desc:'5 Algebra sessions',check:(st)=>(st.domainCounts?.Algebra||0)>=5},
  {id:'geometry_ace',icon:'📐',name:'Geometry Genius',desc:'5 Geometry sessions',check:(st)=>(st.domainCounts?.Geometry||0)>=5},
  {id:'number_cruncher',icon:'🔢',name:'Number Cruncher',desc:'Math question right on first try, 15 sessions',check:(st)=>(st.mathCorrectFirstTryCount||0)>=15},
  {id:'domain_master_math',icon:'🎲',name:'Domain Master',desc:'Answer math from 5 different domains',check:(st)=>Object.keys(st.domainCounts||{}).length>=5},
  {id:'math_level_7',icon:'📈',name:'Math Wizard',desc:'Reach math level 7.0',check:(st)=>(st.mathLevel||0)>=7.0},
  {id:'math_level_8',icon:'🧮',name:'Math Master',desc:'Reach math level 8.0',check:(st)=>(st.mathLevel||0)>=8.0},
  // ── Reading ──
  {id:'reading_up',icon:'📚',name:'Reading Level Up',desc:'Reach a new reading level',check:(st,sess)=>sess&&sess.readingLevelUp},
  {id:'bookworm',icon:'📖',name:'Bookworm',desc:'Reach reading level 7.0',check:(st)=>(st.readingLevel||0)>=7.0},

async function pushToSupabase(childId,state){
  const r=await fetch(`${SB_URL}/rest/v1/child_state`,{

    headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},

  });
  if(!r.ok)throw new Error(`Supabase ${r.status}`);
}
async function pullFromSupabase(p){
  try{
    const localRaw=localStorage.getItem(p.storageKey);
    const localTime=localRaw?JSON.parse(localRaw)._savedAt||0:0;
    const r=await fetch(`${SB_URL}/rest/v1/child_state?child_id=eq.${p.id}&select=state`,{
      headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`}
    });
    if(!r.ok)return null;
    const data=await r.json();
    if(!data||!data[0])return null;
    const remote=data[0].state;
    const remoteTime=remote._savedAt||0;
    if(remoteTime<=localTime){
      // Local is at least as fresh — re-push local to Supabase to keep it in sync
      if(localRaw&&localTime>0)pushToSupabase(p.id,JSON.parse(localRaw)).catch(()=>{});
      return null;
    }
    return Object.assign(defaultState(p),remote);
  }catch{return null;}
}

// ─── Grading: client-side first, AI fallback ──────────────────────────────────
function normalizeText(s){return String(s||'').toLowerCase().replace(/[^\w\s]/g,' ').replace(/\s+/g,' ').trim();}

function gradeLocally(studentAnswer,variants){
  const sa=normalizeText(studentAnswer);
  if(!sa||sa.length<1)return false;
  return variants.some(v=>{
    const vn=normalizeText(v);
    if(!vn)return false;
    if(sa.includes(vn))return true;
    if(vn.length<=20&&vn.includes(sa))return true;
    // word overlap: 70% of meaningful words in variant appear in answer
    const words=vn.split(' ').filter(w=>w.length>2);
    if(words.length>=2){const hits=words.filter(w=>sa.includes(w)).length;return hits/words.length>=0.7;}
    return false;
  });
}

async function gradeAnswer(question,studentAnswer,variants,fullAnswer,isMath){
  // Try local first
  if(gradeLocally(studentAnswer,variants))return true;
  // AI fallback — very lenient, only use to catch "close but worded differently"
  try{
    const prompt=`You are grading a ${isMath?'math':'reading comprehension'} answer from a child.

Question: ${question}
Correct answer: ${fullAnswer}
Acceptable phrasings: ${variants.join(' | ')}
Child's answer: "${studentAnswer}"

${isMath?'Accept if the correct number/calculation is present, regardless of phrasing.':'Be VERY lenient. Accept if the child clearly knows the right fact, even if phrased differently or incompletely. Only mark wrong if the key fact is simply not there or is factually incorrect.'}

Reply ONLY with: {"correct":true} or {"correct":false}`;
    const raw=await callClaude([{role:'user',content:prompt}],'You grade children\'s answers very leniently. Return only valid JSON.',100);
    const r=JSON.parse(raw.replace(/```json\n?/g,'').replace(/```\n?/g,'').trim());
    return!!r.correct;
  }catch{return false;}
}

  const formatInst=isCYP
    ?`FORMAT: Choose-Your-Path.\nWrite the story up to a decision point (~${part1Words} words). End with EXACTLY:\nOption A: [description]\nOption B: [description]\nSTOP there.`
    :`FORMAT: Detective Mystery.\nBuild a mystery solvable only through careful reading. The math situation is the key clue. Resolve it by the end. ~${wordLength} words.`;
  const heroNote=heroName?`\nUse "${heroName}" as the main character or sidekick name.`:'';
  const contNote=storySummary?`\nCONTINUITY (only if topic asks to continue): ${storySummary}`:'';
  const fc=factCount||3;
  const interestNote=(profile.interests&&profile.interests.length)?`\n- If — and only if — it fits this specific domain and topic naturally, you may frame one fact or scene through something ${profile.name} loves (${profile.interests.join(', ')}). Never force it, and never let it override or replace the topic itself — skip it entirely rather than make it feel bolted on.`:'';
  const factNote=factDomain?`
FACTUAL LEARNING DOMAIN: ${factDomain}
- Choose ONE narrow, specific angle within this domain (e.g., not "ancient Rome" but "how Roman aqueducts brought water to cities")
- Weave ${fc} real, accurate facts into the plot — the character USES or DISCOVERS them to solve problems, never lectures about them
- Facts must be well-established and unambiguous — no contested science or history
- Measurements: use imperial first (feet, miles, pounds, °F) with metric in parentheses on first use — e.g., "15 miles (24 km)"
- The factual content should feel like a natural part of the adventure, not a school lesson${interestNote}`:'';
  return `You are writing a story for ${profile.name}, age ${profile.age}, entering ${profile.grade} grade.

STYLE: ${profile.sentenceComplexity}${heroNote}
${factNote}
MATH SITUATION — CRITICAL:
- Embed exactly ONE math situation matched to level ${mathLevel.toFixed(1)} in "${mathDomain}"
- Give the reader all numbers needed to solve it
- DO NOT solve it, show the steps, or reveal the answer anywhere in the story
- A character may notice or face the problem — they must NOT work through it or say the answer

LIFE LESSON: "${lifeLesson}" — shown through character ACTIONS only, never stated

${formatInst}

TOPIC: ${topic}${contNote}

Start the story immediately — no title headers, no preamble.`;
}

function buildContinuationPrompt({firstPart,choice,profile,readingLevel,mathLevel,mathDomain,lifeLesson,wordLength}){
  return `Continue this Choose-Your-Path story for ${profile.name}, age ${profile.age}.
STYLE: ${profile.sentenceComplexity}
Math domain: ${mathDomain} at level ${mathLevel.toFixed(1)} — DO NOT solve or reveal the math answer.
Life lesson: "${lifeLesson}" through actions only.

First part (do not repeat):
---
${firstPart}
---
Choice made: "${choice}"

Write the continuation (~${Math.round(wordLength*0.4)} words). End the story satisfyingly.`;
}

function buildQuestionsPrompt({story,mathDomain,lifeLesson,profile,readingLevel,numQ,numMathQ,numFactQ,factCount}){
  const n=numQ||profile.numQuestions;
  const nm=numMathQ||1;
  const nf=numFactQ||0;
  const fc=factCount||3;
  const nGeneral=Math.max(n-nm-nf-1,0); // 1 slot reserved for the mandatory "lesson" question
  return `Create exactly ${n} comprehension questions for ${profile.name}, age ${profile.age}, reading level ${readingLevel.toFixed(1)}.

Story:
---
${story}
---
Math domain: ${mathDomain} | Life lesson theme: "${lifeLesson}"

═══════════════════════════════════════════
CRITICAL RULES — READ CAREFULLY:
═══════════════════════════════════════════

QUESTION STRUCTURE:
✗ NEVER use "and" to join two questions into one
✗ NEVER ask about feelings, emotions, or motivations ("how did he feel", "why did she feel")
✗ NEVER ask inference questions — only facts directly stated in the story
✓ Every question must have ONE specific answer clearly stated in the story text
✓ Use these templates (vary them):
   - "What did [name] [do/say/find/use] when [specific moment]?"
   - "Where was [name] when [specific moment]?"
   - "What [object/number/name/place] did [name] [have/find/need/use]?"
   - "What happened right after [specific moment]?"
   - "Who [did specific action]?"
   - "Why did the author describe [specific detail]?" (author's purpose — max 1 of these)

MATH QUESTIONS (exactly ${nm}, type "math"):
   - Ask ${profile.name} to calculate the answer himself
   - Each must use different numbers from the story
   - Example: "What is the total if [story numbers]? Calculate it."
   - full_answer must show the calculation steps and final number
${nf>0?`
FACT QUESTIONS (exactly ${nf}, type "fact"):
   - Ask directly about one of the real-world facts you list in fact_bullets below — something stated plainly in the story, not requiring outside knowledge
   - Do NOT quiz plot details here, only the factual/educational content
   - Gets a "choices" array + "correct_choice" just like a general question (see MULTIPLE CHOICE below)
`:''}
ACCEPTABLE VARIANTS (critical for fair grading):
   For every question, list 4-8 different ways a child might correctly express the answer.
   Think of short answers, long answers, different word choices, number formats.
   Example for "how many gallons": ["4 and a quarter", "4 1/4", "4.25", "four and a quarter gallons", "four and a quarter", "4¼"]

HINTS:
   hint1: Name the EXACT story moment — "[Character] [specific action] [specific location in story]"
          Example: "Look at the part where Marco reads Mrs. Patel's note in the garden shed"
          NOT: "reread the middle section"
   hint2: Ask a focused yes/no or fill-in question about that exact moment — still no answer
   hint3_partial: First half of the answer, cut mid-sentence

MULTIPLE CHOICE (non-math questions ONLY):
   For every "general", "lesson", and "fact" question, add a "choices" array with exactly 4 options and a "correct_choice" field:
   - "choices": ["A. [correct or wrong answer]","B. ...","C. ...","D. ..."]
   - "correct_choice": "A" (or B, C, D — whichever letter holds the correct answer)
   - Randomize which letter is correct each time
   - Wrong choices must be plausible but clearly wrong to a careful reader
   - Do NOT include "acceptable_variants" for these — just choices + correct_choice
   Math questions stay as typed-answer format (no choices).

Return a JSON OBJECT (not array) with these keys:
{
  "fact_topic": "The specific subtopic you chose (e.g., 'Roman aqueducts' or 'how volcanoes form')",
  "fact_bullets": ["Short punchy real-world fact 1", "..." /* exactly ${fc} of these */],
  "questions": [
    non-math: {"q":"...","type":"lesson|general|fact","choices":["A. ...","B. ...","C. ...","D. ..."],"correct_choice":"B","hint1":"...","hint2":"...","hint3_partial":"...","full_answer":"..."},
    math:      {"q":"...","type":"math","acceptable_variants":["...","...","...","..."],"hint1":"...","hint2":"...","hint3_partial":"...","full_answer":"..."}
  ]
}

- fact_topic: the specific angle you picked (one phrase, e.g. "Roman aqueducts")
- fact_bullets: exactly ${fc} real facts from the domain — short, punchy, surprising. NOT summaries of the story. Real-world truths that appeared in the story.
- questions array: exactly ${n} questions total
  - Exactly ${nm} type "math"
  ${nf>0?`- Exactly ${nf} type "fact"\n  `:''}- Exactly 1 type "lesson" (about what a character DID, not how they felt)
  - Remaining ${nGeneral} type "general"
- Return ONLY the JSON object, nothing else`;
}

function buildClarifyPrompt(story,question,clarifyQ,profile){
  return `You are a helpful tutor for ${profile.name}, age ${profile.age}.

Story context:
---
${story}
---

Question ${profile.name} is working on: "${question}"
${profile.name} asked: "${clarifyQ}"

Answer in 2-3 sentences — explain a word, a math concept (not the specific answer), or rephrase the question clearly. Do NOT give away the comprehension answer. End with a brief redirect back to the question.`;
}

function buildSummaryPrompt(story){return`Write a 3-4 sentence story summary for continuity. Include character names, setting, key events, ending. Return only the summary.\n\n${story}`;}

function renderHome(){
  const p=S.activeProfile,st=S.persistedState,today=new Date();
  const format=getFormatForDate(today),domain=p.mathDomains[st.mathDomainIndex%p.mathDomains.length];
  const todayStr=today.toDateString(),sessToday=st.lastSessionDate===todayStr?(st.sessionsCompletedToday||0):0;
  const storeItems=STORE[p.id]||[],packs=storeItems.filter(i=>i.type==='setting_pack'&&(st.unlockedItems||[]).includes(i.id));
  const anns=S.levelAnnouncements||[],bbs=S.newBadges||[];
  const banners=anns.map(a=>`<div class="level-announce mb8">${eh(a)}</div>`).join('');
  const badgeBanners=bbs.map(bid=>{const b=ALL_BADGES.find(x=>x.id===bid);return b?`<div class="level-announce mb8">${b.icon} New badge unlocked: <strong>${b.name}</strong></div>`:''}).join('');

    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start;"><span class="tag tag-accent">Reading ${st.readingLevel.toFixed(1)}</span><span class="tag tag-accent">Math ${st.mathLevel.toFixed(1)}</span>${sessToday>0?`<span class="tag tag-success">${sessToday} done today</span>`:''}</div>

  <div class="card mb12">
    <div class="row mb12" style="gap:16px;"><div><label>Today's format</label><div class="bold">${format}</div></div><div><label>Math domain</label><div class="bold">${domain}</div></div></div>
    <hr class="divider">
    <h3 class="mb10">What's today's story about?</h3>
    <p class="text-muted mb10" style="font-size:.88rem;">Pick a character and setting — or any idea.</p>
    <label>Your idea</label>
    <textarea id="topicInput" style="min-height:70px;" placeholder="e.g. A kid who finds a treasure map in an old library book…" rows="3"></textarea>
    ${packs.length>0?`<div class="mt8"><p class="text-xs text-muted mb6">Unlocked story starters:</p><div style="display:flex;gap:6px;flex-wrap:wrap;">${packs.map(pk=>pk.settings.map((s,i)=>`<button class="btn btn-secondary text-xs" style="padding:4px 10px;flex:none;" onclick="document.getElementById('topicInput').value=\`${ea(s)}\`">${pk.icon} ${i+1}</button>`).join('')).join('')}</div></div>`:''}
    <div class="row mt12">

function renderLoading(){return`<div class="loading-center"><div class="spinner"></div><p>${eh(S.loadingMsg||'Writing your story…')}</p><p class="text-muted text-sm mt8">Usually takes 20–40 seconds.</p></div>`;}

function renderStoryDetective(){return`<div class="session-hdr"><div><h2>🔍 Your Story</h2><span class="tag tag-accent">Detective</span></div></div><div class="story-panel mb16" style="max-height:68vh;"><div class="story-text">${eh(S.fullStory||'')}</div></div>${S.error?`<div class="error-box mb10">${eh(S.error)}</div>`:''}<button class="btn btn-primary btn-full btn-lg" id="readyForQBtn">Ready for questions →</button>`;}

// ─── Questions Screen ──────────────────────────────────────────────────────────
function renderQuestions(){
  const qs=S.questions||[],qi=S.currentQ,q=qs[qi];
  if(!q)return renderWrapup();
  const total=qs.length,hl=S.hintLevel||0,showFull=S.showFullAnswer;
  const sessionPts=(S.answers||[]).reduce((s,a)=>s+(a.pointsEarned||0),0);

  // Progress dots
  const dots=qs.map((_,i)=>{
    if(i<qi){const a=S.answers[i];return`<div class="q-dot ${a?.correct?'q-dot-correct':'q-dot-wrong'}" data-qi="${i}" title="Q${i+1}: ${a?.correct?'Correct':'Incorrect'}">${i+1}</div>`;}
    if(i===qi)return`<div class="q-dot q-dot-current">${i+1}</div>`;
    return`<div class="q-dot q-dot-upcoming">${i+1}</div>`;
  }).join('');

  // Past Q detail popup
  let qDetail='';
  if(S.expandedQDot!==null&&S.expandedQDot<qi){
    const dq=qs[S.expandedQDot],da=S.answers[S.expandedQDot];
    qDetail=`<div class="q-review-popup"><div style="font-weight:600;margin-bottom:6px;">Q${S.expandedQDot+1}: ${eh(dq?.q||'')}</div><div>${da?.correct?'<span class="correct-tag">✓ CORRECT</span>':'<span class="wrong-tag">✗ INCORRECT</span>'}${da?.hintsUsed>0?` <span class="text-xs text-muted">(${da.hintsUsed} hint${da.hintsUsed>1?'s':''})</span>`:''}</div>${da?.userAnswer?`<div class="mt4 text-sm"><span class="text-muted">Answered:</span> ${eh(da.userAnswer)}</div>`:''}<div class="mt4 text-sm"><span class="text-muted">Full answer:</span> ${eh(dq?.full_answer||'')}</div></div>`;
  }

  // Wrong attempts for current question
  const wrongAttempts=S.wrongAttempts||[];
  const wrongHTML=wrongAttempts.map(wa=>`<div class="wrong-attempt"><div class="wrong-attempt-label">✗ Incorrect attempt</div><div>${eh(wa)}</div></div>`).join('');

  return`<div class="session-hdr">
    <div><h2>Question ${qi+1} of ${total}</h2><div class="text-muted text-sm">${S.score} correct so far</div></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;"><span class="tag">${S.format}</span><span class="points-pill" id="rewardsNavBtn">⭐ ${(S.persistedState?.points||0)+sessionPts} pts</span></div>
  </div>

  <div class="card card-sm mb12">
    <div class="q-dots">${dots}</div>
    ${qDetail}
  </div>

  <div class="q-layout">
    <!-- Story — left sticky column -->
    <div class="q-story-col">
      <div class="text-xs text-muted bold mb4">📖 Story</div>
      <div class="story-panel"><div class="story-text">${eh(S.fullStory||'')}</div></div>
    </div>

    <!-- Question — right column -->
    <div>
      <div class="card">
        <div style="font-size:1rem;font-weight:600;margin-bottom:14px;line-height:1.4;">${eh(q.q)}</div>

        ${wrongHTML}

        ${hl>=1&&!showFull?`<div class="hint-box mt10"><strong>Hint 1:</strong> ${eh(q.hint1)}</div>`:''}
        ${hl>=2&&!showFull?`<div class="hint-box mt10"><strong>Hint 2:</strong> ${eh(q.hint2)}</div>`:''}
        ${hl>=3&&!showFull?`<div class="hint-box mt10"><strong>Hint 3 (partial answer):</strong> ${eh(q.hint3_partial)}…<br><em class="text-muted text-sm">Can you complete the thought?</em></div>`:''}
        ${showFull?`<div class="answer-box mt10"><strong>Full answer:</strong> ${eh(q.full_answer)}</div>`:''}

        ${S.gradingError?`<div class="error-box mt10">${eh(S.gradingError)} <button class="btn btn-secondary mt8" style="padding:5px 12px;font-size:.82rem;" id="retryGradeBtn">Retry</button></div>`:''}

        ${S.correctFeedback?`
          <div class="correct-celebrate mt12">
            <div class="celebrate-check">✓</div>
            <div class="celebrate-pts">Correct!</div>
            <div class="celebrate-bonus">+${S.correctFeedback.points} points</div>
            <div class="celebrate-sub">${qi+1<total?'Moving to next question…':'Almost done…'}</div>
          </div>
        `:q.choices&&q.type!=='math'?`
          <div class="choices-grid mt12">
            ${(q.choices||[]).map((c,ci)=>{
              const letter=c.charAt(0);
              const isWrong=(S.wrongChoices||[]).includes(letter);
              return`<button class="choice-btn${isWrong?' choice-wrong':''}" id="choiceBtn_${letter}" data-letter="${letter}" ${isWrong?'disabled':''}>${eh(c)}</button>`;
            }).join('')}
          </div>
          ${wrongAttempts.length>0?`<div class="mt10 text-center"><button class="parent-override-btn" id="parentOverrideBtn">Parent: mark correct</button></div>`:''}
        `:!showFull?`
          <div class="mt12"><label>Your answer:</label>
          <textarea id="answerInput" style="min-height:80px;" rows="3" placeholder="Type your answer here…"></textarea></div>
          <div class="row mt10">
            <button class="btn btn-primary" id="submitAnswerBtn" ${S.gradingLoading?'disabled':''}>${S.gradingLoading?'Checking…':'Submit answer'}</button>
            ${hl<3?`<button class="btn btn-secondary" id="hintBtn" ${S.gradingLoading?'disabled':''}>Get a hint (${3-hl} left)</button>`:''}
          </div>
          ${hl>=3?`<button class="btn btn-warning btn-full mt8" id="showFullBtn">Show full answer & move on</button>`:''}
          ${wrongAttempts.length>0?`<div class="mt10 text-center"><button class="parent-override-btn" id="parentOverrideBtn">Parent: mark correct</button></div>`:''}
        `:`<button class="btn btn-primary btn-full mt12" id="nextQBtn">Next ${qi+1<total?'question':'to results'} →</button>`}

        <div class="clarify-section">
          <button class="clarify-toggle" id="clarifyToggle">${S.clarifyVisible?'▼ Hide':'▶ Ask about a word, the math, or what this question is asking'}</button>
          ${S.clarifyVisible?`
            ${S.clarifyResponse?`<div class="clarify-response mb8">${eh(S.clarifyResponse)}</div>`:''}
            <div class="clarify-form">
              <textarea id="clarifyInput" style="min-height:46px;" placeholder="Ask anything…" rows="2">${eh(S.clarifyText||'')}</textarea>
              <button class="btn btn-secondary" style="white-space:nowrap;align-self:flex-end;padding:8px 14px;" id="submitClarifyBtn" ${S.clarifyLoading?'disabled':''}>${S.clarifyLoading?'…':'Ask'}</button>
            </div>`:''}
        </div>
      </div>
    </div>
  </div>`;
}

// ─── Wrapup ───────────────────────────────────────────────────────────────────
function renderWrapup(){
  const score=S.score,total=(S.questions||[]).length;
  const sessionPts=(S.answers||[]).reduce((s,a)=>s+(a.pointsEarned||0),0)+5;
  const qSummary=(S.questions||[]).map((q,i)=>{
    const a=S.answers[i];if(!a)return'';
    return`<div class="history-q"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;"><div class="text-sm"><span class="bold">Q${i+1}:</span> ${eh(q.q)}</div><div style="white-space:nowrap;">${a.correct?'<span class="correct-tag">✓</span>':'<span class="wrong-tag">✗</span>'}${a.hintsUsed>0?` <span class="text-xs text-muted">${a.hintsUsed}h</span>`:''}</div></div>${a.userAnswer?`<div class="text-xs text-muted mt4">Answered: ${eh(a.userAnswer)}</div>`:''}<div class="text-xs mt4"><span class="text-muted">Answer: </span>${eh(q.full_answer)}</div></div>`;
  }).join('');
  const hasReal=S.factBullets&&S.factBullets.length>0;
  return`<div class="card text-center" style="padding:32px 20px;"><h2 class="mb12">Session complete! 🎉</h2><div class="score-big mb4">${score}/${total}</div><div class="pts-earned">+${sessionPts} points this session</div><p class="text-muted mt8 mb16">Nice work, ${eh((S.activeProfile||PROFILES.gio).name)}.</p>${hasReal?`<button class="btn btn-secondary btn-lg mb8" id="seeRealBtn">🔍 See What Was Real</button><br>`:''}<button class="btn btn-primary btn-lg" id="goParentReviewBtn">Parent review →</button></div><div class="card"><h3 class="mb12">Session Review</h3>${qSummary||'<p class="text-muted text-sm">No answers recorded.</p>'}</div>`;
}

// ─── Parent Review ────────────────────────────────────────────────────────────
function renderParentReview(){
  const st=S.persistedState,p=S.activeProfile;
  const rs=S.reviewScore!==null?S.reviewScore:S.score;
  const rrl=S.reviewReadingLevel!==null?S.reviewReadingLevel:st.readingLevel;
  const rml=S.reviewMathLevel!==null?S.reviewMathLevel:st.mathLevel;
  const numQ=S.numQ||p.numQuestions;
  const{announcements}=computeLevelChanges({...st,readingLevel:rrl,mathLevel:rml},rs,numQ,p.name);
  return`<div class="card" style="max-width:500px;margin:0 auto;"><h2 class="mb4">Parent Review — ${eh(p.name)}</h2><p class="text-muted mb16" style="font-size:.88rem;">Adjust if needed. Nothing saves until you confirm.</p><div class="pr-field"><label>Session score</label><input type="number" id="reviewScoreInput" min="0" max="${numQ}" step="1" value="${rs}"><span class="text-muted text-sm">/ ${numQ}</span></div><div class="pr-field"><label>Reading level (current: ${st.readingLevel.toFixed(1)})</label><input type="number" id="reviewReadingInput" min="1.0" max="12.0" step="0.1" value="${rrl.toFixed(1)}"></div><div class="pr-field"><label>Math level (current: ${st.mathLevel.toFixed(1)})</label><input type="number" id="reviewMathInput" min="1.0" max="12.0" step="0.1" value="${rml.toFixed(1)}"></div><hr class="divider">${announcements.length>0?announcements.map(a=>`<div class="level-announce">${eh(a)}</div>`).join(''):'<p class="text-muted text-sm">No level changes this session.</p>'}${S.error?`<div class="error-box mt10">${eh(S.error)}</div>`:''}<div class="row mt16"><button class="btn btn-success btn-lg" id="confirmSaveBtn">✓ Confirm & Save</button><button class="btn btn-secondary" id="cancelReviewBtn">← Back</button></div></div>`;
}

// ─── Rewards ──────────────────────────────────────────────────────────────────
function renderRewards(){
  const p=S.activeProfile,st=S.persistedState;
  const pts=st.points||0;
  const owned=st.unlockedItems||[];
  const eq=st.avatarEquipped||{};

  // Find cheapest unowned item across all categories
  const allShop=[...(STORE[p.id]||[]),...ALL_AV_ITEMS];
  const nextUnlock=allShop.filter(i=>!owned.includes(i.id)).sort((a,b)=>a.cost-b.cost)[0];
  const ptsUntilNext=nextUnlock?Math.max(0,nextUnlock.cost-pts):0;

  // Avatar section
  const avatarHTML=renderAvatar(eq,140);
  function avSlotRow(label,db,slot){
    const none=`<span class="equip-chip${!eq[slot]?' active':''}" data-slot="${slot}" data-item="" id="equip_${slot}_none">None</span>`;
    const chips=Object.values(db).map(item=>{
      const isOwned=owned.includes(item.id);
      const isActive=eq[slot]===item.id;
      if(isOwned){
        return`<span class="equip-chip${isActive?' active':''}" data-slot="${slot}" data-item="${item.id}" id="equip_${slot}_${item.id}">${item.icon} ${item.name}</span>`;
      }
      return`<span class="equip-chip locked" title="⭐ ${item.cost} pts to unlock">${item.icon} ${item.name} (${item.cost}pts)</span>`;
    }).join('');
    return`<div class="equip-slot-label">${label}</div><div class="equip-row">${none}${chips}</div>`;
  }

  // Theme switcher
  const themeItems=STORE[p.id]?.filter(i=>i.type==='theme')||[];
  const defaultChip=`<span class="theme-chip${!st.activeTheme?' active':''}" data-themeid="default" id="themeChip_default"><span class="theme-swatch" style="background:#5b7ff5"></span>Default</span>`;
  const themeChips=themeItems.map(ti=>{
    const t=THEMES[ti.id];
    const isOwned=owned.includes(ti.id);
    const isActive=st.activeTheme===ti.id;
    if(isOwned){
      return`<span class="theme-chip${isActive?' active':''}" data-themeid="${ti.id}" id="themeChip_${ti.id}"><span class="theme-swatch" style="background:${t?.color||'#5b7ff5'}"></span>${ti.name}</span>`;
    }
    return`<span class="theme-chip locked" title="⭐ ${ti.cost} pts"><span class="theme-swatch" style="background:${t?.color||'#888'}"></span>${ti.name} (${ti.cost}pts)</span>`;
  }).join('');

  // Other store items (packs, hero name — not themes)
  const otherItems=(STORE[p.id]||[]).filter(i=>i.type!=='theme');
  const otherHTML=otherItems.map(item=>{
    const isOwned=owned.includes(item.id);
    const canAfford=pts>=item.cost;
    let action=isOwned?`<div class="text-xs text-success mt8">✓ Unlocked</div>`
      :`<button class="btn btn-primary mt8" style="width:100%;font-size:.78rem;padding:5px;" data-itemid="${item.id}" id="buyBtn_${item.id}" ${!canAfford?'disabled':''}>${canAfford?'Buy':'Need '+(item.cost-pts)+' more pts'}</button>`;
    return`<div class="store-card${isOwned?' owned':''}"><div style="font-size:1.4rem;">${item.icon}</div><div class="store-name">${item.name}</div><div class="store-desc">${item.desc}</div>${!isOwned?`<div class="store-price">⭐ ${item.cost} pts</div>`:''} ${action}</div>`;
  }).join('');

  // Avatar shop items
  const avShopHTML=ALL_AV_ITEMS.map(item=>{
    const isOwned=owned.includes(item.id);
    const canAfford=pts>=item.cost;
    const isActive=eq[avSlotOf(item.id)]===item.id;
    let action='';
    if(isOwned&&isActive)action=`<div class="text-xs text-accent mt6">✓ Equipped</div>`;
    else if(isOwned)action=`<button class="btn btn-secondary mt6" style="width:100%;font-size:.76rem;padding:4px;" data-slot="${avSlotOf(item.id)}" data-item="${item.id}" id="equipBtn_${item.id}">Equip</button>`;
    else action=`<button class="btn btn-primary mt6" style="width:100%;font-size:.76rem;padding:4px;" data-itemid="${item.id}" id="buyAvBtn_${item.id}" ${!canAfford?'disabled':''}>${canAfford?'Buy':'Need '+(item.cost-pts)+' more pts'}</button>`;
    return`<div class="store-card${isOwned?' owned':''}"><div style="font-size:1.3rem;">${item.icon}</div><div class="store-name" style="font-size:.8rem;">${item.name}</div>${!isOwned?`<div class="store-price">⭐ ${item.cost}</div>`:''} ${action}</div>`;
  }).join('');

  const badgeHTML=ALL_BADGES.map(b=>{const earned=(st.badges||[]).includes(b.id);return`<div class="badge-card${earned?' earned':' locked'}"><div class="badge-icon">${b.icon}</div><div class="badge-name">${b.name}</div><div class="badge-desc">${earned?'✓ Earned':b.desc}</div></div>`;}).join('');

  return`<div class="session-hdr"><div><h2>⭐ ${eh(p.name)}'s Rewards</h2></div><button class="btn btn-secondary" style="padding:7px 14px;" id="backHomeBtn">← Home</button></div>

  <div class="card text-center" style="padding:20px;">
    <div style="display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap;">
      ${avatarHTML}
      <div>
        <div style="font-size:2.6rem;font-weight:800;color:var(--warning);">⭐ ${pts}</div>
        <div class="text-muted text-sm mt4">total points</div>
        ${nextUnlock?`<div class="mt8 text-sm">🎯 <strong>${ptsUntilNext} pts</strong> until: <strong>${nextUnlock.name}</strong></div>`:'<div class="text-success text-sm mt8">🏆 Everything unlocked!</div>'}
      </div>
    </div>
  </div>

  <div class="card">
    <h3 class="mb4">🎨 Customize Your Avatar</h3>
    <p class="text-xs text-muted mb8">Tap an item to equip it. Locked items show their price.</p>
    ${avSlotRow('🎩 Hat',AV_HAT,'hat')}
    ${avSlotRow('👕 Outfit',AV_OUTFIT,'outfit')}
    ${avSlotRow('✨ Accessory',AV_ACC,'accessory')}
    ${avSlotRow('🐾 Pet',AV_PET,'pet')}
    ${avSlotRow('🖼 Background',AV_BG,'background')}
    ${avSlotRow('💫 Trail Effect',AV_TRAIL,'trail')}
  </div>

  <div class="card">
    <h3 class="mb8">🎨 Themes</h3>
    <p class="text-xs text-muted mb4">Owned themes are clickable. Buy locked ones in the Avatar Shop below.</p>
    <div class="theme-grid">${defaultChip}${themeChips}</div>
  </div>

  <div class="card"><h3 class="mb4">🛍 Avatar Shop</h3><p class="text-xs text-muted mb10">Buy items to unlock them for your avatar</p><div class="store-grid">${avShopHTML}</div></div>

  ${otherItems.length>0?`<div class="card"><h3 class="mb4">🛒 Story Packs & Extras</h3><div class="store-grid">${otherHTML}</div></div>`:''}

  <div class="card"><h3 class="mb4">🏅 Badge Wall</h3><p class="text-xs text-muted mb10">${(st.badges||[]).length} of ${ALL_BADGES.length} earned</p><div class="badge-grid">${badgeHTML}</div></div>`;
}

function renderHistory(){
  const p=S.activeProfile,st=S.persistedState;
  const history=(st.sessionHistory||[]).slice().reverse();
  const histHTML=history.length===0?'<p class="text-muted text-sm">No sessions completed yet.</p>':history.map(sess=>`<div class="history-session"><div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:6px;"><div><div class="bold text-sm">${eh(sess.date)}</div><div class="text-xs text-muted">${eh(sess.format)} · Math: ${eh(sess.domain)}${sess.factTopic||sess.factDomain?` · 📚 ${eh(sess.factTopic||sess.factDomain)}`:''}</div></div><div style="display:flex;gap:8px;align-items:center;"><span class="tag${sess.score===sess.total?' tag-success':''}">${sess.score}/${sess.total}</span><span class="text-xs text-warning">+${sess.pointsEarned||0} pts</span></div></div><div class="mt8">${(sess.questions||[]).map((q,qi)=>`<div class="history-q"><div style="display:flex;justify-content:space-between;gap:8px;"><div class="text-sm"><span class="bold">Q${qi+1}:</span> ${eh(q.q)}</div><div>${q.correct?'<span class="correct-tag">✓</span>':'<span class="wrong-tag">✗</span>'}${q.hintsUsed>0?` <span class="text-xs text-muted">${q.hintsUsed}h</span>`:''}</div></div>${q.userAnswer?`<div class="text-xs text-muted mt4">Answered: ${eh(q.userAnswer)}</div>`:''}<div class="text-xs mt4 text-muted">Answer: ${eh(q.fullAnswer)}</div></div>`).join('')}${sess.story?`<details class="mt8"><summary class="history-story-toggle">📖 View full story</summary><div class="history-story">${eh(sess.story)}</div></details>`:''}</div></div>`).join('');
  return`<div class="session-hdr"><div><h2>📋 ${eh(p.name)}'s Session History</h2></div><button class="btn btn-secondary" style="padding:7px 14px;" id="backHomeBtn">← Home</button></div>${histHTML}`;
}

function renderFactPick(){
  const opts=S.factPickOptions||[];
  return`<div class="session-hdr">
    <div><h2>Pick your learning theme</h2><div class="text-muted text-sm">Today's story will weave in real facts from this topic</div></div>
    <button class="btn btn-secondary" style="padding:7px 14px;" id="backHomeBtn">← Back</button>
  </div>
  <div class="fact-pick-grid">
    ${opts.map((d,i)=>`<button class="fact-pick-card" id="factPickBtn_${i}" data-idx="${i}">
      <div class="fact-pick-icon">${d.icon}</div>
      <div class="fact-pick-name">${eh(d.name)}</div>
      <div class="fact-pick-examples">${eh(d.examples)}</div>
    </button>`).join('')}
  </div>`;
}

function renderFactReveal(){
  const bullets=S.factBullets||[];
  const topic=S.factTopic||S.factDomain||'Today\'s topic';
  const cards=bullets.length?bullets.map((b,i)=>`<div class="flip-card" id="flipCard_${i}">
    <div class="flip-card-inner">
      <div class="flip-card-front">Revealing fact ${i+1}…</div>
      <div class="flip-card-back"><div class="flip-fact-label">Real fact ${i+1}</div><div class="flip-fact-text">${eh(b)}</div></div>
    </div>
  </div>`).join(''):'<p class="text-muted text-sm">No facts recorded for this session.</p>';
  return`<div class="card text-center" style="padding:28px 20px 18px;">
    <div style="font-size:2.2rem;margin-bottom:8px;">🔍</div>
    <h2 class="mb4">What Was Real</h2>
    <p class="text-muted text-sm">These facts from today's story are 100% true</p>
    <p style="font-size:.82rem;font-weight:600;color:var(--accent);margin-top:6px;">${eh(topic)}</p>
  </div>
  <div class="card">
    <div class="flip-cards">${cards}</div>
    <button class="btn btn-primary btn-full mt8" id="goParentReviewBtn">Parent review →</button>
  </div>`;
}

function renderSettings(){
  const p=S.activeProfile,st=S.persistedState,wl=st.storyWordLength||p.defaultStoryWords,key=loadApiKey();
  const nq=st.numQuestions||p.numQuestions;
  return`<div class="session-hdr"><div><h2>⚙ Settings — ${eh(p.name)}</h2></div><button class="btn btn-secondary" style="padding:7px 14px;" id="backHomeBtn">← Home</button></div>
  <div class="card"><h3 class="mb12">Anthropic API Key</h3><label>API Key</label><input type="password" id="apiKeyInput" value="${eh(key)}" placeholder="sk-ant-..." autocomplete="off"><p class="api-key-note">Stored only in this browser.</p><div class="mt12"><button class="btn btn-secondary" id="saveApiKeyBtn">Save Key</button></div>${S.error?`<div class="error-box mt10">${eh(S.error)}</div>`:''}</div>
  <div class="card"><h3 class="mb4">Questions Per Session</h3><p class="text-muted text-sm mb12">How many total questions ${eh(p.name)} answers each session.</p><div class="pr-field"><label style="min-width:0;margin:0;">Total questions</label><input type="number" id="numQInput" min="3" max="15" step="1" value="${nq}"><span class="text-muted text-sm"> (3–15)</span></div><div class="mt4"><label style="min-width:0;margin:0;">Math questions</label><input type="number" id="numMathQInput" min="1" max="5" step="1" value="${st.numMathQuestions||1}"><span class="text-muted text-sm"> (1–5, must be less than total)</span></div><div class="mt4"><label style="min-width:0;margin:0;">Fact questions</label><input type="number" id="numFactQInput" min="0" max="3" step="1" value="${st.numFactQuestions||0}"><span class="text-muted text-sm"> (0–3, optional — quizzes on the real facts woven into the story)</span></div><div class="mt12"><button class="btn btn-primary" id="saveNumQBtn">Save</button></div></div>
  <div class="card"><h3 class="mb4">Math Topics</h3><p class="text-muted text-sm mb12">Choose which math topics appear in ${eh(p.name)}'s sessions. At least one must be selected.</p>${ALL_MATH_DOMAINS.map(d=>{const active=st.customMathDomains?st.customMathDomains.includes(d):p.mathDomains.includes(d);return`<label style="display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer;"><input type="checkbox" class="math-domain-chk" value="${eh(d)}" ${active?'checked':''}><span>${eh(d)}</span></label>`;}).join('')}<div class="mt12"><button class="btn btn-primary" id="saveMathDomainsBtn">Save Topics</button></div></div>
  <div class="card"><h3 class="mb4">Learning Topics</h3><p class="text-muted text-sm mb12">Stories weave in real facts from a rotating topic. Control what ${eh(p.name)} learns about.</p>
  <label class="bold text-sm">Facts woven into story</label><p class="text-muted text-sm mb8">How many real facts get built into the plot (revealed after in "What Was Real"). Light keeps it subtle; rich packs in more.</p>
  <div class="pr-field"><label style="min-width:0;margin:0;">Fact count</label><input type="number" id="factIntensityInput" min="2" max="5" step="1" value="${st.factIntensity||3}"><span class="text-muted text-sm"> (2–5)</span></div>
  <hr style="margin:16px 0;border:none;border-top:1px solid var(--border);">
  <label class="bold text-sm">Parent topic override</label><p class="text-muted text-sm mb8">Type anything specific — a chapter topic, a historical event, a science concept. Stays active until you clear it.</p>
  <div style="display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;"><input type="text" id="factFreeformInput" placeholder="e.g., Battle of Bunker Hill" value="${eh(st.factDomainFreeform||'')}"><button class="btn btn-primary" id="saveFactFreeformBtn" style="white-space:nowrap;">Set</button>${st.factDomainFreeform?`<button class="btn btn-secondary" id="clearFactFreeformBtn" style="white-space:nowrap;">Clear</button>`:''}</div>
  ${st.factDomainFreeform?`<div class="text-xs mt6" style="color:var(--warning);">Active override: "${eh(st.factDomainFreeform)}"</div>`:''}
  <hr style="margin:16px 0;border:none;border-top:1px solid var(--border);">
  <label class="bold text-sm">Active topic categories</label><p class="text-muted text-sm mb8">Uncheck any topic to remove it from rotation.</p>
  ${FACT_DOMAINS.map(d=>{const active=!st.factDomainsActive||st.factDomainsActive.includes(d.id);return`<label style="display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer;"><input type="checkbox" class="fact-domain-chk" value="${d.id}" ${active?'checked':''}><span>${d.icon} ${eh(d.name)}</span></label>`;}).join('')}
  <hr style="margin:16px 0;border:none;border-top:1px solid var(--border);">
  <label style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:4px 0;"><input type="checkbox" id="factRepeatLimitChk" ${st.factDomainRepeatLimit?'checked':''}><span class="text-sm">Limit repeats — prevent the same topic 3 sessions in a row</span></label>
  <div class="mt12"><button class="btn btn-primary" id="saveFactDomainsBtn">Save</button></div></div>
  <div class="card"><h3 class="mb4">Story Length</h3><p class="text-muted text-sm mb12">Shorter = faster session; longer = more to read.</p><label>Target word count: <strong id="wlDisplay">${wl}</strong> words</label><input type="range" id="wordLengthSlider" min="400" max="1200" step="50" value="${wl}" oninput="document.getElementById('wlDisplay').textContent=this.value"><div style="display:flex;justify-content:space-between;font-size:.75rem;color:var(--text2);margin-top:4px;"><span>400 (short)</span><span>1200 (long)</span></div><div class="mt12"><button class="btn btn-primary" id="saveWordLengthBtn">Save</button></div></div>`;
}

// ─── Event Binding ─────────────────────────────────────────────────────────────
function bindEvents(){
  on('setupBtn','click',handleSetupContinue);
  document.querySelectorAll('.child-tab[data-child-id]').forEach(btn=>{btn.addEventListener('click',()=>switchChild(btn.dataset.childId));});
  on('rewardsNavBtn','click',()=>goTo('rewards'));
  on('rewardsBtnHome','click',()=>goTo('rewards'));
  on('historyBtn','click',()=>goTo('history'));
  on('settingsBtn','click',showPinModal);
  on('backHomeBtn','click',()=>goTo('home'));
  on('startNewBtn','click',handleStartNew);
  on('continueBtn','click',handleStartContinue);
  on('seenFirstPartBtn','click',()=>setState({screen:'decision'}));
  on('optABtn','click',(e)=>handleOptionChoice(e.currentTarget.dataset.choice));
  on('optBBtn','click',(e)=>handleOptionChoice(e.currentTarget.dataset.choice));
  on('submitChoiceBtn','click',()=>{const v=val('customChoiceInput');if(v.trim())handleOptionChoice(v.trim());});
  on('readyForQBtn','click',handleReadyForQuestions);
  on('submitAnswerBtn','click',handleSubmitAnswer);
  on('hintBtn','click',()=>setState({hintLevel:Math.min((S.hintLevel||0)+1,3)}));
  on('showFullBtn','click',()=>setState({showFullAnswer:true}));
  on('nextQBtn','click',()=>finalizeQuestion(false,''));
  on('retryGradeBtn','click',handleSubmitAnswer);
  on('clarifyToggle','click',()=>setState({clarifyVisible:!S.clarifyVisible,clarifyResponse:null,clarifyText:''}));
  on('submitClarifyBtn','click',handleClarify);
  on('goParentReviewBtn','click',()=>setState({screen:'parent-review',reviewScore:S.score,reviewReadingLevel:S.persistedState.readingLevel,reviewMathLevel:S.persistedState.mathLevel,error:null}));
  on('reviewScoreInput','input',(e)=>setState({reviewScore:parseInt(e.target.value,10)||0}));
  on('reviewReadingInput','input',(e)=>setState({reviewReadingLevel:parseFloat(e.target.value)||S.persistedState.readingLevel}));
  on('reviewMathInput','input',(e)=>setState({reviewMathLevel:parseFloat(e.target.value)||S.persistedState.mathLevel}));
  on('confirmSaveBtn','click',handleConfirmSave);
  on('cancelReviewBtn','click',()=>setState({screen:'wrapup'}));
  on('saveApiKeyBtn','click',()=>{const k=val('apiKeyInput').trim();if(k){saveApiKey(k);setState({error:null});}else{setState({error:'Please enter a valid API key.'});}});
  on('saveWordLengthBtn','click',handleSaveWordLength);
  on('saveNumQBtn','click',handleSaveNumQ);
  on('saveMathDomainsBtn','click',handleSaveMathDomains);
  on('parentOverrideBtn','click',handleParentOverride);
  on('seeRealBtn','click',()=>{const st=S.persistedState;const ns={...st,factRevealCount:(st.factRevealCount||0)+1};S.persistedState=ns;saveState(S.activeProfile,ns);setState({screen:'fact-reveal'});});
  on('saveFactFreeformBtn','click',handleSaveFactFreeform);
  on('clearFactFreeformBtn','click',handleClearFactFreeform);
  on('saveFactDomainsBtn','click',handleSaveFactDomains);
  document.querySelectorAll('[id^="factPickBtn_"]').forEach(el=>el.addEventListener('click',()=>handleFactPick(parseInt(el.dataset.idx,10))));
  document.querySelectorAll('.choice-btn[data-letter]').forEach(el=>el.addEventListener('click',()=>handleChoiceSelect(el.dataset.letter)));
  if(S.screen==='fact-reveal'){(S.factBullets||[]).forEach((_,i)=>{setTimeout(()=>{const c=document.getElementById(`flipCard_${i}`);if(c)c.classList.add('flipped');},i*1600+700);});}
  document.querySelectorAll('.q-dot[data-qi]').forEach(el=>el.addEventListener('click',()=>{const qi=parseInt(el.dataset.qi,10);setState({expandedQDot:S.expandedQDot===qi?null:qi});}));

function getActiveFactDomains(st){
  if(!st.factDomainsActive||!st.factDomainsActive.length)return FACT_DOMAINS;
  return FACT_DOMAINS.filter(d=>st.factDomainsActive.includes(d.id));
}

function buildFactPickOptions(st){
  let pool=getActiveFactDomains(st);
  if(st.factDomainRepeatLimit&&(st.factDomainRecentChoices||[]).length>=3){
    const last3=st.factDomainRecentChoices.slice(-3);
    if(last3.every(id=>id===last3[0])){
      const filtered=pool.filter(d=>d.id!==last3[0]);
      if(filtered.length)pool=filtered;
    }
  }
  const idx=(st.factDomainIndex||0)%pool.length;
  const optA=pool[idx];
  const rest=pool.filter(d=>d.id!==optA.id);
  const optB=rest.length?rest[Math.floor(Math.random()*rest.length)]:optA;
  return[optA,optB];
}

    setTimeout(()=>finalizeQuestion(true,letter),1600);
  }else{

async function handleSubmitAnswer(){
  const answer=val('answerInput').trim();
  if(!answer)return;
  const qs=S.questions,qi=S.currentQ,q=qs[qi],hl=S.hintLevel||0;

  // After hint 3, they can still submit and get credit
  setState({gradingLoading:true,gradingError:null});
  try{
    const correct=await gradeAnswer(q.q,answer,q.acceptable_variants||[q.full_answer],q.full_answer,q.type==='math');
    setState({gradingLoading:false});
    if(correct){
      const pts=pointsForAnswer(true,hl);
      const trail=S.persistedState?.avatarEquipped?.trail;
      setState({gradingLoading:false,correctFeedback:{points:pts,trail}});
      if(trail&&AV_TRAIL[trail])spawnTrail(AV_TRAIL[trail].particles);
      setTimeout(()=>finalizeQuestion(true,answer),1600);
      return;
    }else{
      // Keep wrong answer visible, advance hint
      const newWrong=[...(S.wrongAttempts||[]),answer];
      const newHL=Math.min(hl+1,3);
      setState({wrongAttempts:newWrong,hintLevel:newHL});
      if(newHL>=3&&hl>=3){
        // Already at hint 3 and still wrong — they've been here; let them keep trying or show answer
        // (no auto-fail; they choose to show answer themselves)
      }
    }
  }catch(err){setState({gradingLoading:false,gradingError:`Grading error: ${err.message}`});}
}

function finalizeQuestion(correct,userAnswer,overridePts){
  const hl=S.hintLevel||0,pts=overridePts!==undefined?overridePts:pointsForAnswer(correct,hl);
  const newAnswers=[...(S.answers||[]),{correct,hintsUsed:hl,userAnswer,pointsEarned:pts}];
  const newScore=S.score+(correct?1:0);
  const nextQ=S.currentQ+1,isLast=nextQ>=(S.questions||[]).length;
  if(isLast)setState({answers:newAnswers,score:newScore,screen:'wrapup',currentQ:nextQ,correctFeedback:null});
  else setState({answers:newAnswers,score:newScore,currentQ:nextQ,hintLevel:0,showFullAnswer:false,wrongAttempts:[],wrongChoices:[],clarifyVisible:false,clarifyText:'',clarifyResponse:null,gradingError:null,expandedQDot:null,correctFeedback:null});
}
function spawnTrail(particles){
  for(let i=0;i<10;i++){
    const el=document.createElement('div');
    el.className='trail-particle';
    el.textContent=particles[Math.floor(Math.random()*particles.length)];
    const x=15+Math.random()*70;
    const y=30+Math.random()*40;
    el.style.cssText=`left:${x}vw;top:${y}vh;--tx:${(Math.random()-.5)*60}px;--ty:${-30-Math.random()*60}px;animation-delay:${i*0.07}s;`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),1400);
  }
}

// ─── Confirm Save — save FIRST, then update summary in background ──────────────
async function handleConfirmSave(){
  const p=S.activeProfile;
  let st=S.persistedState;
  // Re-sync just the parent-controlled settings fields against the freshest
  // known copy before writing this session's progress back. Finishing a
  // session saves the WHOLE state blob — if this device's in-memory copy is
  // stale (left open across a settings change made elsewhere), that write's
  // timestamp is still genuinely the newest one, so it would otherwise
  // silently revert the setting. Progress fields (points, badges, levels,
  // streaks) are intentionally left alone — they reflect what actually
  // happened in this session on this device.
  try{
    const baseline=await freshestState(p);
    const patch={};
    SETTINGS_FIELDS.forEach(k=>{if(baseline[k]!==undefined)patch[k]=baseline[k];});
    st={...st,...patch};
  }catch{}
  const score=S.reviewScore!==null?S.reviewScore:S.score;
  const rrl=S.reviewReadingLevel!==null?S.reviewReadingLevel:st.readingLevel;
  const rml=S.reviewMathLevel!==null?S.reviewMathLevel:st.mathLevel;
  const numQ=S.numQ||p.numQuestions;
  const{changes,announcements,meta}=computeLevelChanges({...st,readingLevel:rrl,mathLevel:rml},score,numQ,p.name);

  const todayStr=S.sessionDate||new Date().toDateString();

  // Consecutive streak
  let streak=st.consecutiveStreak||0;
  if(!st.lastSessionDate){streak=1;}
  else if(st.lastSessionDate!==todayStr){
    const diff=Math.round((new Date(todayStr)-new Date(st.lastSessionDate))/86400000);
    streak=diff===1?streak+1:1;
  }
  // else same day — don't change streak

  const sessToday=st.lastSessionDate===todayStr?(st.sessionsCompletedToday||0)+1:1;
  const sessionPts=(S.answers||[]).reduce((s,a)=>s+(a.pointsEarned||0),0)+5;
  const newPoints=(st.points||0)+sessionPts;
  const domainCounts={...(st.domainCounts||{})};
  domainCounts[S.mathDomain]=(domainCounts[S.mathDomain]||0)+1;
  const detectiveCount=(st.detectiveCount||0)+(S.format==='Detective'?1:0);
  const cypCount=(st.cypCount||0)+(S.format==='Choose-Your-Path'?1:0);
  const allNoHint=(S.answers||[]).every(a=>(a.hintsUsed||0)===0);
  const hadComeback=(S.answers||[]).some((a,i)=>!a.correct&&(S.answers||[]).slice(i+1).some(b=>b.correct));
  const isPerfectSession=score===numQ&&allNoHint;
  const perfectSessions=(st.perfectSessions||0)+(isPerfectSession?1:0);
  const consecutivePerfect=isPerfectSession?(st.consecutivePerfect||0)+1:0;
  const sessionNoHintCount=(st.sessionNoHintCount||0)+(allNoHint?1:0);
  const totalCorrect=(st.totalCorrect||0)+score;
  const mathQ=(S.questions||[]).find(q=>q.type==='math');
  const mathIdx=mathQ?(S.questions||[]).indexOf(mathQ):-1;
  const mathAns=mathIdx>=0?(S.answers||[])[mathIdx]:null;
  const mathFirstTry=!!(mathAns&&mathAns.correct&&(mathAns.hintsUsed||0)===0);
  const mathCorrectFirstTryCount=(st.mathCorrectFirstTryCount||0)+(mathFirstTry?1:0);
  const factDomainCounts={...(st.factDomainCounts||{})};
  if(S.factDomainId&&S.factDomainId!=='freeform')factDomainCounts[S.factDomainId]=(factDomainCounts[S.factDomainId]||0)+1;
  const earlyBird=new Date().getHours()<9;

  const sessionEntry={
    date:todayStr,format:S.format,domain:S.mathDomain,
    factDomain:S.factDomain||null,factTopic:S.factTopic||null,
    score,total:numQ,pointsEarned:sessionPts,earlyBird,
    allNoHint,hadComeback,readingLevelUp:meta.readingLevelUp,mathLevelUp:meta.mathLevelUp,
    story:S.fullStory||'',
    questions:(S.questions||[]).map((q,i)=>{const a=(S.answers||[])[i]||{};return{q:q.q,type:q.type,correct:!!a.correct,hintsUsed:a.hintsUsed||0,userAnswer:a.userAnswer||'',fullAnswer:q.full_answer};}),
  };

  const newHistory=[...(st.sessionHistory||[]),sessionEntry].slice(-30);

  // Build new state
  const newState={
    ...st,...changes,
    lifeLessonIndex:(st.lifeLessonIndex+1)%LIFE_LESSONS.length,
    mathDomainIndex:(st.mathDomainIndex+1)%(st.customMathDomains&&st.customMathDomains.length?st.customMathDomains:p.mathDomains).length,
    factDomainIndex:st.factDomainFreeform?st.factDomainIndex:(st.factDomainIndex+1)%Math.max(getActiveFactDomains(st).length,1),
    factDomainRecentChoices:st.factDomainFreeform?st.factDomainRecentChoices||[]:[...(st.factDomainRecentChoices||[]),S.factDomainId||''].slice(-3),
    lastSessionDate:todayStr,sessionsCompletedToday:sessToday,
    consecutiveStreak:streak,domainCounts,detectiveCount,cypCount,
    perfectSessions,consecutivePerfect,sessionNoHintCount,totalCorrect,
    mathCorrectFirstTryCount,factDomainCounts,
    points:newPoints,sessionHistory:newHistory,
    lastStorySummary:st.lastStorySummary||'',
  };

  // Check badges against new state
  const newBadgeIds=checkBadges({...newState,points:newPoints},sessionEntry);
  newState.badges=[...(st.badges||[]),...newBadgeIds];

  // *** SAVE IMMEDIATELY — before any async operations ***
  const stamped={...newState,_savedAt:Date.now()};
  try{localStorage.setItem(p.storageKey,JSON.stringify(stamped));}catch(e){console.error('Save failed',e);}
  setState({persistedState:stamped,screen:'home',levelAnnouncements:announcements,newBadges:newBadgeIds,error:null,syncStatus:'saving'});

  // Push to Supabase and surface the result so parent can see if it failed
  pushToSupabase(p.id,stamped)
    .then(()=>{ setState({syncStatus:'ok'}); })
    .catch(()=>{ setState({syncStatus:'failed'}); });

  // Update story summary in background — won't block anything
  callClaude([{role:'user',content:buildSummaryPrompt(S.fullStory||'')}],'You write brief story summaries.',300)
    .then(summary=>{
      const updated={...stamped,lastStorySummary:summary};
      saveState(p,updated);
      S.persistedState=updated; // update in memory without re-render
    })
    .catch(()=>{}); // silently ignore — summary is non-critical
}

  const id=themeId==='default'?null:themeId;
  const ns={...S.persistedState,activeTheme:id};
  saveState(S.activeProfile,ns);applyTheme(id||'default');setState({persistedState:ns});
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function extractOption(text,letter){const re=new RegExp(`Option\\s+${letter}[:\\s]+(.+?)(?=Option\\s+[AB]|$)`,'is');const m=text.match(re);return m?m[1].trim().replace(/\n/g,' ').slice(0,220):null;}
function eh(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/\n/g,'<br>');}
function ea(s){if(!s)return'';return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/\n/g,' ');}

// ─── Boot ─────────────────────────────────────────────────────────────────────
(async function boot(){
  const key=loadApiKey();
  if(key){
    const p=loadActiveChild();
    // Load from localStorage immediately so screen appears fast
    let st=loadState(p);
    S.activeProfile=p;S.persistedState=st;S.screen='home';
    if(st.activeTheme)applyTheme(st.activeTheme);
    render();
    // Then pull from Supabase and update if data exists there
    const remote=await pullFromSupabase(p);
    applyRemoteIfStillNewer(p,remote);
  } else {
    render();
  }
})();
</script>
