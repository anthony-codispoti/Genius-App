<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Reading & Math</title>
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3352;--accent:#5b7ff5;--success:#3dba7a;--warning:#f5a623;--danger:#e85d5d;--text:#e8eaf0;--text2:#8b92b3;--r:12px;--rs:8px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;}
#app{max-width:1060px;margin:0 auto;padding:16px 14px 60px;}
h1{font-size:1.7rem;font-weight:700;}h2{font-size:1.3rem;font-weight:600;}h3{font-size:1.05rem;font-weight:600;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:14px;}
.card-sm{padding:14px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border:none;border-radius:var(--rs);font-size:.95rem;font-weight:600;cursor:pointer;transition:opacity .15s,transform .1s;}
.btn:hover{opacity:.88;}.btn:active{transform:scale(.97);}.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-primary{background:var(--accent);color:#fff;}.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.btn-success{background:var(--success);color:#fff;}.btn-warning{background:var(--warning);color:#000;}.btn-full{width:100%;}.btn-lg{padding:14px 28px;font-size:1rem;}
.row{display:flex;gap:10px;flex-wrap:wrap;}.row>*{flex:1;min-width:120px;}
label{display:block;font-size:.82rem;color:var(--text2);margin-bottom:5px;font-weight:500;}
input[type="text"],input[type="password"],textarea{width:100%;padding:9px 13px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-size:.95rem;outline:none;transition:border-color .15s;}
input:focus,textarea:focus{border-color:var(--accent);}
textarea{resize:vertical;font-family:inherit;}
input[type="number"]{width:80px;padding:7px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-size:.95rem;outline:none;}
input[type="range"]{width:100%;accent-color:var(--accent);}
.tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:.75rem;font-weight:600;background:var(--surface2);border:1px solid var(--border);}
.tag-accent{background:rgba(91,127,245,.18);border-color:var(--accent);color:var(--accent);}
.tag-success{background:rgba(61,186,122,.15);border-color:var(--success);color:var(--success);}
.divider{border:none;border-top:1px solid var(--border);margin:16px 0;}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-center{text-align:center;padding:60px 20px;}
.loading-center p{margin-top:14px;color:var(--text2);}
/* Story */
.story-text{font-size:1rem;line-height:1.9;white-space:pre-wrap;}
.story-panel{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;overflow-y:auto;}
/* Questions two-col layout */
.q-layout{display:grid;grid-template-columns:45% 1fr;gap:14px;align-items:start;}
.q-story-col{position:sticky;top:14px;display:flex;flex-direction:column;gap:8px;}
.q-story-col .story-panel{overflow-y:auto;height:calc(100vh - 160px);min-height:400px;}
@media(max-width:740px){
  .q-layout{grid-template-columns:1fr;}
  .q-story-col{position:static;}
  .q-story-col .story-panel{height:260px;min-height:200px;}
}
/* Hints / answers */
.hint-box{background:rgba(245,166,35,.08);border:1px solid rgba(245,166,35,.3);border-radius:var(--rs);padding:12px 14px;margin-top:10px;font-size:.93rem;}
.answer-box{background:rgba(61,186,122,.08);border:1px solid rgba(61,186,122,.3);border-radius:var(--rs);padding:12px 14px;margin-top:10px;font-size:.93rem;}
.error-box{background:rgba(232,93,93,.1);border:1px solid rgba(232,93,93,.3);border-radius:var(--rs);padding:12px 14px;margin-top:10px;}
/* Wrong attempt display */
.wrong-attempt{background:rgba(232,93,93,.07);border:1px solid rgba(232,93,93,.25);border-radius:var(--rs);padding:9px 13px;margin-top:8px;font-size:.88rem;}
.wrong-attempt-label{font-size:.72rem;font-weight:700;color:var(--danger);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;}
/* Progress dots */
.q-dots{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.q-dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;cursor:pointer;transition:transform .1s;}
.q-dot:hover{transform:scale(1.1);}
.q-dot-correct{background:var(--success);color:#fff;}
.q-dot-wrong{background:var(--danger);color:#fff;}
.q-dot-current{background:var(--accent);color:#fff;box-shadow:0 0 0 3px rgba(91,127,245,.35);}
.q-dot-upcoming{background:var(--surface2);color:var(--text2);border:1px solid var(--border);}
.q-review-popup{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-top:8px;font-size:.87rem;}
.correct-tag{color:var(--success);font-weight:700;font-size:.76rem;}
.wrong-tag{color:var(--danger);font-weight:700;font-size:.76rem;}
/* Clarify */
.clarify-section{margin-top:14px;border-top:1px solid var(--border);padding-top:12px;}
.clarify-toggle{color:var(--accent);font-size:.84rem;cursor:pointer;text-decoration:underline;background:none;border:none;padding:0;}
.clarify-form{margin-top:8px;display:flex;gap:8px;}
.clarify-form textarea{min-height:46px;}
.clarify-response{background:rgba(91,127,245,.08);border:1px solid rgba(91,127,245,.2);border-radius:var(--rs);padding:10px 12px;margin-top:8px;font-size:.9rem;}
/* Parent review */
.pr-field{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
.pr-field:last-child{border-bottom:none;}
.pr-field label{margin:0;min-width:170px;font-size:.92rem;color:var(--text);}
.level-announce{padding:10px 14px;margin:6px 0;background:rgba(61,186,122,.1);border:1px solid rgba(61,186,122,.3);border-radius:var(--rs);color:var(--success);font-weight:600;}
/* Child switcher */
.child-switcher{display:flex;border-radius:var(--rs);overflow:hidden;border:1px solid var(--border);width:fit-content;}
.child-tab{padding:7px 22px;cursor:pointer;font-weight:600;font-size:.9rem;background:var(--surface2);color:var(--text2);border:none;transition:background .15s,color .15s;}
.child-tab.active{background:var(--accent);color:#fff;}
/* Option buttons */
.option-btn{display:block;width:100%;text-align:left;padding:14px 18px;margin-bottom:10px;background:var(--surface2);border:2px solid var(--border);border-radius:var(--r);cursor:pointer;color:var(--text);font-size:.95rem;transition:border-color .15s,background .15s;}
.option-btn:hover{border-color:var(--accent);background:rgba(91,127,245,.06);}
/* Gamification */
.points-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;background:rgba(245,166,35,.15);border:1px solid rgba(245,166,35,.3);border-radius:20px;font-size:.82rem;font-weight:700;color:var(--warning);cursor:pointer;}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px;}
.badge-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:12px;text-align:center;}
.badge-card.earned{border-color:var(--warning);background:rgba(245,166,35,.08);}
.badge-card.locked{opacity:.42;}
.badge-icon{font-size:1.8rem;margin-bottom:4px;}
.badge-name{font-size:.76rem;font-weight:600;line-height:1.3;}
.badge-desc{font-size:.68rem;color:var(--text2);margin-top:3px;line-height:1.3;}
.store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;margin-top:12px;}
.store-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:14px;text-align:center;}
.store-card.owned{border-color:var(--success);}
.store-price{font-size:.8rem;color:var(--warning);font-weight:700;margin-top:6px;}
.store-name{font-size:.88rem;font-weight:600;}
.store-desc{font-size:.72rem;color:var(--text2);margin-top:3px;line-height:1.3;}
.top-nav{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.top-nav-right{margin-left:auto;display:flex;gap:8px;align-items:center;}
.history-session{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:14px;margin-bottom:10px;}
.history-q{padding:8px 0;border-bottom:1px solid var(--border);font-size:.87rem;}
.history-q:last-child{border-bottom:none;}
.score-big{font-size:2.8rem;font-weight:800;text-align:center;color:var(--accent);line-height:1;}
.pts-earned{font-size:1.1rem;color:var(--warning);font-weight:700;text-align:center;margin-top:4px;}
.api-key-note{font-size:.78rem;color:var(--text2);margin-top:5px;}
/* Correct-answer celebration */
.correct-celebrate{background:linear-gradient(135deg,rgba(61,186,122,.15),rgba(91,127,245,.08));border:2px solid var(--success);border-radius:var(--r);padding:28px 20px;text-align:center;animation:cel-in .3s ease;}
@keyframes cel-in{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:scale(1);}}
.celebrate-check{font-size:3rem;line-height:1;margin-bottom:8px;}
.celebrate-pts{font-size:2rem;font-weight:800;color:var(--success);}
.celebrate-bonus{font-size:1.1rem;color:var(--warning);font-weight:700;margin-top:2px;}
.celebrate-sub{color:var(--text2);font-size:.88rem;margin-top:8px;}
/* Floating trail particles */
@keyframes particle-rise{0%{opacity:1;transform:translate(0,0) scale(1);}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(.4);}}
.trail-particle{position:fixed;pointer-events:none;z-index:9999;font-size:1.6rem;animation:particle-rise 1.1s ease-out forwards;}
/* Avatar */
.avatar-wrap{display:inline-block;filter:drop-shadow(0 6px 16px rgba(0,0,0,.5));}
.equip-slot-label{font-size:.72rem;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 5px;}
.equip-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:4px;}
.equip-chip{display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:20px;font-size:.8rem;font-weight:600;border:2px solid var(--border);background:var(--surface2);cursor:pointer;transition:border-color .12s,background .12s;}
.equip-chip:hover{border-color:var(--accent);}
.equip-chip.active{border-color:var(--accent);background:rgba(91,127,245,.12);}
.equip-chip.locked{opacity:.45;cursor:default;}
/* Themes switcher */
.theme-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.theme-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;font-size:.82rem;font-weight:600;border:2px solid var(--border);background:var(--surface2);cursor:pointer;transition:border-color .12s;}
.theme-chip.active{border-color:var(--accent);}
.theme-chip.locked{opacity:.42;cursor:default;}
.theme-swatch{width:14px;height:14px;border-radius:50%;flex-shrink:0;}
/* Dramatic theme body classes */
body.th-hacker{background-image:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,230,118,.018) 3px,rgba(0,230,118,.018) 4px);}
body.th-space{background-image:radial-gradient(1px 1px at 22% 18%,rgba(255,255,255,.45),transparent),radial-gradient(1px 1px at 68% 8%,rgba(255,255,255,.35),transparent),radial-gradient(1px 1px at 40% 55%,rgba(255,255,255,.3),transparent),radial-gradient(1px 1px at 85% 40%,rgba(255,255,255,.4),transparent),radial-gradient(1px 1px at 12% 70%,rgba(255,255,255,.35),transparent);}
body.th-ocean::before{content:'';position:fixed;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.3;pointer-events:none;}
.session-hdr{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
.mt4{margin-top:4px;}.mt8{margin-top:8px;}.mt10{margin-top:10px;}.mt12{margin-top:12px;}.mt16{margin-top:16px;}.mt20{margin-top:20px;}
.mb4{margin-bottom:4px;}.mb8{margin-bottom:8px;}.mb10{margin-bottom:10px;}.mb12{margin-bottom:12px;}.mb16{margin-bottom:16px;}
.text-muted{color:var(--text2);}.text-sm{font-size:.85rem;}.text-xs{font-size:.75rem;}
.text-success{color:var(--success);}.text-danger{color:var(--danger);}.text-warning{color:var(--warning);}.text-accent{color:var(--accent);}
.bold{font-weight:700;}.text-center{text-align:center;}
</style>
</head>

function computeLevelChanges(state,score,total,pname){
  total=total||5;
  const c={readingLevel:state.readingLevel,mathLevel:state.mathLevel,readingConsec5:state.readingConsec5||0,readingConseqLow:state.readingConseqLow||0,mathConsec5:state.mathConsec5||0,mathConseqLow:state.mathConseqLow||0};
  const ann=[],meta={readingLevelUp:false,mathLevelUp:false};
  const low=Math.ceil(total*0.55);
  let rc5=c.readingConsec5,rcL=c.readingConseqLow;
  if(score===total){rc5++;rcL=0;}else if(score<low){rcL++;rc5=0;}else{rc5=0;rcL=0;}
  if(rc5>=2){c.readingLevel=Math.round((state.readingLevel+0.1)*10)/10;rc5=0;meta.readingLevelUp=true;ann.push(`${pname} moved up to ${c.readingLevel.toFixed(1)} in reading — earned it.`);}
  c.readingConsec5=rc5;c.readingConseqLow=rcL;
  let mc5=c.mathConsec5,mcL=c.mathConseqLow;
  if(score===total){mc5++;mcL=0;}else if(score<low){mcL++;mc5=0;}else{mc5=0;mcL=0;}

  c.mathConsec5=mc5;c.mathConseqLow=mcL;
  return{changes:c,announcements:ann,meta};
}

async function callClaude(messages,system,maxTokens=2000){
  const key=loadApiKey();if(!key)throw new Error('No API key set.');
  const fp=fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:MODEL,max_tokens:maxTokens,system,messages})}).then(async r=>{if(!r.ok){const e=await r.text();throw new Error(`API ${r.status}: ${e}`);}return r.json();});
  const tp=new Promise((_,rej)=>setTimeout(()=>rej(new Error('Request timed out (60s). Please retry.')),60000));
  const d=await Promise.race([fp,tp]);
  return d.content[0].text;
}

// ─── Grading: client-side first, AI fallback ──────────────────────────────────
function normalizeText(s){return String(s||'').toLowerCase().replace(/[^\w\s]/g,' ').replace(/\s+/g,' ').trim();}

function gradeLocally(studentAnswer,variants){
  const sa=normalizeText(studentAnswer);
  if(!sa||sa.length<1)return false;
  return variants.some(v=>{
    const vn=normalizeText(v);
    if(!vn)return false;
    if(sa.includes(vn))return true;
    if(vn.length<=20&&vn.includes(sa))return true;
    // word overlap: 70% of meaningful words in variant appear in answer
    const words=vn.split(' ').filter(w=>w.length>2);
    if(words.length>=2){const hits=words.filter(w=>sa.includes(w)).length;return hits/words.length>=0.7;}
    return false;
  });
}

async function gradeAnswer(question,studentAnswer,variants,fullAnswer,isMath){
  // Try local first
  if(gradeLocally(studentAnswer,variants))return true;
  // AI fallback — very lenient, only use to catch "close but worded differently"
  try{
    const prompt=`You are grading a ${isMath?'math':'reading comprehension'} answer from a child.

Question: ${question}
Correct answer: ${fullAnswer}
Acceptable phrasings: ${variants.join(' | ')}
Child's answer: "${studentAnswer}"

${isMath?'Accept if the correct number/calculation is present, regardless of phrasing.':'Be VERY lenient. Accept if the child clearly knows the right fact, even if phrased differently or incompletely. Only mark wrong if the key fact is simply not there or is factually incorrect.'}

Reply ONLY with: {"correct":true} or {"correct":false}`;
    const raw=await callClaude([{role:'user',content:prompt}],'You grade children\'s answers very leniently. Return only valid JSON.',100);
    const r=JSON.parse(raw.replace(/```json\n?/g,'').replace(/```\n?/g,'').trim());
    return!!r.correct;
  }catch{return false;}
}

// ─── Prompts ──────────────────────────────────────────────────────────────────
function buildStoryPrompt({format,profile,readingLevel,mathLevel,mathDomain,lifeLesson,topic,storySummary,wordLength,heroName}){
  const isCYP=format==='Choose-Your-Path';
  const part1Words=Math.round(wordLength*0.6);
  const formatInst=isCYP
    ?`FORMAT: Choose-Your-Path.\nWrite the story up to a decision point (~${part1Words} words). End with EXACTLY:\nOption A: [description]\nOption B: [description]\nSTOP there.`
    :`FORMAT: Detective Mystery.\nBuild a mystery solvable only through careful reading. The math situation is the key clue. Resolve it by the end. ~${wordLength} words.`;
  const heroNote=heroName?`\nUse "${heroName}" as the main character or sidekick name.`:'';
  const contNote=storySummary?`\nCONTINUITY (only if topic asks to continue): ${storySummary}`:'';
  return `You are writing a story for ${profile.name}, age ${profile.age}, entering ${profile.grade} grade.

STYLE: ${profile.sentenceComplexity}${heroNote}

MATH SITUATION — CRITICAL:
- Embed exactly ONE math situation matched to level ${mathLevel.toFixed(1)} in "${mathDomain}"
- Give the reader all numbers needed to solve it
- DO NOT solve it, show the steps, or reveal the answer anywhere in the story
- A character may notice or face the problem — they must NOT work through it or say the answer

LIFE LESSON: "${lifeLesson}" — shown through character ACTIONS only, never stated

${formatInst}

TOPIC: ${topic}${contNote}

Start the story immediately — no title headers, no preamble.`;
}

function buildContinuationPrompt({firstPart,choice,profile,readingLevel,mathLevel,mathDomain,lifeLesson,wordLength}){
  return `Continue this Choose-Your-Path story for ${profile.name}, age ${profile.age}.
STYLE: ${profile.sentenceComplexity}
Math domain: ${mathDomain} at level ${mathLevel.toFixed(1)} — DO NOT solve or reveal the math answer.
Life lesson: "${lifeLesson}" through actions only.

First part (do not repeat):
---
${firstPart}
---
Choice made: "${choice}"

Write the continuation (~${Math.round(wordLength*0.4)} words). End the story satisfyingly.`;
}

function buildQuestionsPrompt({story,mathDomain,lifeLesson,profile,readingLevel,numQ}){
  const n=numQ||profile.numQuestions;
  return `Create exactly ${n} comprehension questions for ${profile.name}, age ${profile.age}, reading level ${readingLevel.toFixed(1)}.

Story:
---
${story}
---
Math domain: ${mathDomain} | Life lesson theme: "${lifeLesson}"

═══════════════════════════════════════════
CRITICAL RULES — READ CAREFULLY:
═══════════════════════════════════════════

QUESTION STRUCTURE:
✗ NEVER use "and" to join two questions into one
✗ NEVER ask about feelings, emotions, or motivations ("how did he feel", "why did she feel")
✗ NEVER ask inference questions — only facts directly stated in the story
✓ Every question must have ONE specific answer clearly stated in the story text
✓ Use these templates (vary them):
   - "What did [name] [do/say/find/use] when [specific moment]?"
   - "Where was [name] when [specific moment]?"
   - "What [object/number/name/place] did [name] [have/find/need/use]?"
   - "What happened right after [specific moment]?"
   - "Who [did specific action]?"
   - "Why did the author describe [specific detail]?" (author's purpose — max 1 of these)

MATH QUESTION (exactly 1, type "math"):
   - Ask ${profile.name} to calculate the answer himself
   - Example: "What is the total if [story numbers]? Calculate it."
   - full_answer must show the calculation steps and final number

ACCEPTABLE VARIANTS (critical for fair grading):
   For every question, list 4-8 different ways a child might correctly express the answer.
   Think of short answers, long answers, different word choices, number formats.
   Example for "how many gallons": ["4 and a quarter", "4 1/4", "4.25", "four and a quarter gallons", "four and a quarter", "4¼"]

HINTS:
   hint1: Name the EXACT story moment — "[Character] [specific action] [specific location in story]"
          Example: "Look at the part where Marco reads Mrs. Patel's note in the garden shed"
          NOT: "reread the middle section"
   hint2: Ask a focused yes/no or fill-in question about that exact moment — still no answer
   hint3_partial: First half of the answer, cut mid-sentence

Return a JSON array of exactly ${n} objects:
[{"q":"...","type":"math|lesson|general","acceptable_variants":["...","...","...","..."],"hint1":"...","hint2":"...","hint3_partial":"...","full_answer":"..."}]

- Exactly 1 type "math"
- Exactly 1 type "lesson" (about what a character DID, not how they felt)
- Rest type "general"
- Return ONLY the JSON array, nothing else`;
}

function buildClarifyPrompt(story,question,clarifyQ,profile){
  return `You are a helpful tutor for ${profile.name}, age ${profile.age}.

Story context:
---
${story}
---

Question ${profile.name} is working on: "${question}"
${profile.name} asked: "${clarifyQ}"

Answer in 2-3 sentences — explain a word, a math concept (not the specific answer), or rephrase the question clearly. Do NOT give away the comprehension answer. End with a brief redirect back to the question.`;
}

function buildSummaryPrompt(story){return`Write a 3-4 sentence story summary for continuity. Include character names, setting, key events, ending. Return only the summary.\n\n${story}`;}

// ─── Questions Screen ──────────────────────────────────────────────────────────
function renderQuestions(){
  const qs=S.questions||[],qi=S.currentQ,q=qs[qi];
  if(!q)return renderWrapup();
  const total=qs.length,hl=S.hintLevel||0,showFull=S.showFullAnswer;
  const sessionPts=(S.answers||[]).reduce((s,a)=>s+(a.pointsEarned||0),0);

  // Progress dots

    if(i<qi){const a=S.answers[i];return`<div class="q-dot ${a?.correct?'q-dot-correct':'q-dot-wrong'}" data-qi="${i}" title="Q${i+1}: ${a?.correct?'Correct':'Incorrect'}">${i+1}</div>`;}

    return`<div class="q-dot q-dot-upcoming">${i+1}</div>`;
  }).join('');

  // Past Q detail popup
  let qDetail='';

    const dq=qs[S.expandedQDot],da=S.answers[S.expandedQDot];
    qDetail=`<div class="q-review-popup"><div style="font-weight:600;margin-bottom:6px;">Q${S.expandedQDot+1}: ${eh(dq?.q||'')}</div><div>${da?.correct?'<span class="correct-tag">✓ CORRECT</span>':'<span class="wrong-tag">✗ INCORRECT</span>'}${da?.hintsUsed>0?` <span class="text-xs text-muted">(${da.hintsUsed} hint${da.hintsUsed>1?'s':''})</span>`:''}</div>${da?.userAnswer?`<div class="mt4 text-sm"><span class="text-muted">Answered:</span> ${eh(da.userAnswer)}</div>`:''}<div class="mt4 text-sm"><span class="text-muted">Full answer:</span> ${eh(dq?.full_answer||'')}</div></div>`;
  }

  // Wrong attempts for current question
  const wrongAttempts=S.wrongAttempts||[];
  const wrongHTML=wrongAttempts.map(wa=>`<div class="wrong-attempt"><div class="wrong-attempt-label">✗ Incorrect attempt</div><div>${eh(wa)}</div></div>`).join('');

  return`<div class="session-hdr">
    <div><h2>Question ${qi+1} of ${total}</h2><div class="text-muted text-sm">${S.score} correct so far</div></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;"><span class="tag">${S.format}</span><span class="points-pill" id="rewardsNavBtn">⭐ ${(S.persistedState?.points||0)+sessionPts} pts</span></div>

    <div class="q-story-col">
      <div class="text-xs text-muted bold mb4">📖 Story</div>
      <div class="story-panel"><div class="story-text">${eh(S.fullStory||'')}</div></div>
    </div>

    <!-- Question — right column -->
    <div>
      <div class="card">
        <div style="font-size:1rem;font-weight:600;margin-bottom:14px;line-height:1.4;">${eh(q.q)}</div>

        ${hl>=2&&!showFull?`<div class="hint-box mt10"><strong>Hint 2:</strong> ${eh(q.hint2)}</div>`:''}
        ${hl>=3&&!showFull?`<div class="hint-box mt10"><strong>Hint 3 (partial answer):</strong> ${eh(q.hint3_partial)}…<br><em class="text-muted text-sm">Can you complete the thought?</em></div>`:''}
        ${showFull?`<div class="answer-box mt10"><strong>Full answer:</strong> ${eh(q.full_answer)}</div>`:''}

        ${S.gradingError?`<div class="error-box mt10">${eh(S.gradingError)} <button class="btn btn-secondary mt8" style="padding:5px 12px;font-size:.82rem;" id="retryGradeBtn">Retry</button></div>`:''}

        ${S.correctFeedback?`
          <div class="correct-celebrate mt12">
            <div class="celebrate-check">✓</div>
            <div class="celebrate-pts">Correct!</div>
            <div class="celebrate-bonus">+${S.correctFeedback.points} points</div>
            <div class="celebrate-sub">${qi+1<total?'Moving to next question…':'Almost done…'}</div>
          </div>
        `:!showFull?`
          <div class="mt12"><label>Your answer:</label>
          <textarea id="answerInput" style="min-height:80px;" rows="3" placeholder="Type your answer here…"></textarea></div>
          <div class="row mt10">
            <button class="btn btn-primary" id="submitAnswerBtn" ${S.gradingLoading?'disabled':''}>${S.gradingLoading?'Checking…':'Submit answer'}</button>
            ${hl<3?`<button class="btn btn-secondary" id="hintBtn" ${S.gradingLoading?'disabled':''}>Get a hint (${3-hl} left)</button>`:''}
          </div>
          ${hl>=3?`<button class="btn btn-warning btn-full mt8" id="showFullBtn">Show full answer & move on</button>`:''}
        `:`<button class="btn btn-primary btn-full mt12" id="nextQBtn">Next ${qi+1<total?'question':'to results'} →</button>`}

        <div class="clarify-section">
          <button class="clarify-toggle" id="clarifyToggle">${S.clarifyVisible?'▼ Hide':'▶ Ask about a word, the math, or what this question is asking'}</button>

            <div class="clarify-form">

            </div>`:''}
        </div>
      </div>
    </div>
  </div>`;
}

// ─── Wrapup ───────────────────────────────────────────────────────────────────
function renderWrapup(){

    return`<div class="history-q"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;"><div class="text-sm"><span class="bold">Q${i+1}:</span> ${eh(q.q)}</div><div style="white-space:nowrap;">${a.correct?'<span class="correct-tag">✓</span>':'<span class="wrong-tag">✗</span>'}${a.hintsUsed>0?` <span class="text-xs text-muted">${a.hintsUsed}h</span>`:''}</div></div>${a.userAnswer?`<div class="text-xs text-muted mt4">Answered: ${eh(a.userAnswer)}</div>`:''}<div class="text-xs mt4"><span class="text-muted">Answer: </span>${eh(q.full_answer)}</div></div>`;

// ─── Rewards ──────────────────────────────────────────────────────────────────
function renderRewards(){
  const p=S.activeProfile,st=S.persistedState;
  const pts=st.points||0;
  const owned=st.unlockedItems||[];
  const eq=st.avatarEquipped||{};

  // Find cheapest unowned item across all categories
  const allShop=[...(STORE[p.id]||[]),...ALL_AV_ITEMS];
  const nextUnlock=allShop.filter(i=>!owned.includes(i.id)).sort((a,b)=>a.cost-b.cost)[0];
  const ptsUntilNext=nextUnlock?Math.max(0,nextUnlock.cost-pts):0;

  // Avatar section
  const avatarHTML=renderAvatar(eq,140);
  function avSlotRow(label,db,slot){
    const none=`<span class="equip-chip${!eq[slot]?' active':''}" data-slot="${slot}" data-item="" id="equip_${slot}_none">None</span>`;
    const chips=Object.values(db).map(item=>{
      const isOwned=owned.includes(item.id);
      const isActive=eq[slot]===item.id;
      if(isOwned){
        return`<span class="equip-chip${isActive?' active':''}" data-slot="${slot}" data-item="${item.id}" id="equip_${slot}_${item.id}">${item.icon} ${item.name}</span>`;
      }
      return`<span class="equip-chip locked" title="⭐ ${item.cost} pts to unlock">${item.icon} ${item.name} (${item.cost}pts)</span>`;
    }).join('');
    return`<div class="equip-slot-label">${label}</div><div class="equip-row">${none}${chips}</div>`;
  }

  // Theme switcher
  const themeItems=STORE[p.id]?.filter(i=>i.type==='theme')||[];
  const defaultChip=`<span class="theme-chip${!st.activeTheme?' active':''}" data-themeid="default" id="themeChip_default"><span class="theme-swatch" style="background:#5b7ff5"></span>Default</span>`;
  const themeChips=themeItems.map(ti=>{
    const t=THEMES[ti.id];
    const isOwned=owned.includes(ti.id);
    const isActive=st.activeTheme===ti.id;
    if(isOwned){
      return`<span class="theme-chip${isActive?' active':''}" data-themeid="${ti.id}" id="themeChip_${ti.id}"><span class="theme-swatch" style="background:${t?.color||'#5b7ff5'}"></span>${ti.name}</span>`;
    }
    return`<span class="theme-chip locked" title="⭐ ${ti.cost} pts"><span class="theme-swatch" style="background:${t?.color||'#888'}"></span>${ti.name} (${ti.cost}pts)</span>`;
  }).join('');

  // Other store items (packs, hero name — not themes)
  const otherItems=(STORE[p.id]||[]).filter(i=>i.type!=='theme');
  const otherHTML=otherItems.map(item=>{
    const isOwned=owned.includes(item.id);
    const canAfford=pts>=item.cost;
    let action=isOwned?`<div class="text-xs text-success mt8">✓ Unlocked</div>`
      :`<button class="btn btn-primary mt8" style="width:100%;font-size:.78rem;padding:5px;" data-itemid="${item.id}" id="buyBtn_${item.id}" ${!canAfford?'disabled':''}>${canAfford?'Buy':'Need '+(item.cost-pts)+' more pts'}</button>`;
    return`<div class="store-card${isOwned?' owned':''}"><div style="font-size:1.4rem;">${item.icon}</div><div class="store-name">${item.name}</div><div class="store-desc">${item.desc}</div>${!isOwned?`<div class="store-price">⭐ ${item.cost} pts</div>`:''} ${action}</div>`;
  }).join('');

  // Avatar shop items
  const avShopHTML=ALL_AV_ITEMS.map(item=>{
    const isOwned=owned.includes(item.id);
    const canAfford=pts>=item.cost;
    const isActive=eq[avSlotOf(item.id)]===item.id;
    let action='';
    if(isOwned&&isActive)action=`<div class="text-xs text-accent mt6">✓ Equipped</div>`;
    else if(isOwned)action=`<button class="btn btn-secondary mt6" style="width:100%;font-size:.76rem;padding:4px;" data-slot="${avSlotOf(item.id)}" data-item="${item.id}" id="equipBtn_${item.id}">Equip</button>`;
    else action=`<button class="btn btn-primary mt6" style="width:100%;font-size:.76rem;padding:4px;" data-itemid="${item.id}" id="buyAvBtn_${item.id}" ${!canAfford?'disabled':''}>${canAfford?'Buy':'Need '+(item.cost-pts)+' more pts'}</button>`;
    return`<div class="store-card${isOwned?' owned':''}"><div style="font-size:1.3rem;">${item.icon}</div><div class="store-name" style="font-size:.8rem;">${item.name}</div>${!isOwned?`<div class="store-price">⭐ ${item.cost}</div>`:''} ${action}</div>`;
  }).join('');

  const badgeHTML=ALL_BADGES.map(b=>{const earned=(st.badges||[]).includes(b.id);return`<div class="badge-card${earned?' earned':' locked'}"><div class="badge-icon">${b.icon}</div><div class="badge-name">${b.name}</div><div class="badge-desc">${earned?'✓ Earned':b.desc}</div></div>`;}).join('');

  return`<div class="session-hdr"><div><h2>⭐ ${eh(p.name)}'s Rewards</h2></div><button class="btn btn-secondary" style="padding:7px 14px;" id="backHomeBtn">← Home</button></div>

  <div class="card text-center" style="padding:20px;">
    <div style="display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap;">
      ${avatarHTML}
      <div>
        <div style="font-size:2.6rem;font-weight:800;color:var(--warning);">⭐ ${pts}</div>
        <div class="text-muted text-sm mt4">total points</div>
        ${nextUnlock?`<div class="mt8 text-sm">🎯 <strong>${ptsUntilNext} pts</strong> until: <strong>${nextUnlock.name}</strong></div>`:'<div class="text-success text-sm mt8">🏆 Everything unlocked!</div>'}
      </div>
    </div>
  </div>

  <div class="card">
    <h3 class="mb4">🎨 Customize Your Avatar</h3>
    <p class="text-xs text-muted mb8">Tap an item to equip it. Locked items show their price.</p>
    ${avSlotRow('🎩 Hat',AV_HAT,'hat')}
    ${avSlotRow('👕 Outfit',AV_OUTFIT,'outfit')}
    ${avSlotRow('✨ Accessory',AV_ACC,'accessory')}
    ${avSlotRow('🐾 Pet',AV_PET,'pet')}
    ${avSlotRow('🖼 Background',AV_BG,'background')}
    ${avSlotRow('💫 Trail Effect',AV_TRAIL,'trail')}
  </div>

  <div class="card">
    <h3 class="mb8">🎨 Themes</h3>
    <p class="text-xs text-muted mb4">Owned themes are clickable. Buy locked ones in the Avatar Shop below.</p>
    <div class="theme-grid">${defaultChip}${themeChips}</div>
  </div>

  <div class="card"><h3 class="mb4">🛍 Avatar Shop</h3><p class="text-xs text-muted mb10">Buy items to unlock them for your avatar</p><div class="store-grid">${avShopHTML}</div></div>

  ${otherItems.length>0?`<div class="card"><h3 class="mb4">🛒 Story Packs & Extras</h3><div class="store-grid">${otherHTML}</div></div>`:''}

  <div class="card"><h3 class="mb4">🏅 Badge Wall</h3><p class="text-xs text-muted mb10">${(st.badges||[]).length} of ${ALL_BADGES.length} earned</p><div class="badge-grid">${badgeHTML}</div></div>`;
}

  return`<div class="session-hdr"><div><h2>📋 ${eh(p.name)}'s Session History</h2></div><button class="btn btn-secondary" style="padding:7px 14px;" id="backHomeBtn">← Home</button></div>${histHTML}`;
}

function on(id,ev,fn){const el=document.getElementById(id);if(el)el.addEventListener(ev,fn);}
function val(id){const el=document.getElementById(id);return el?el.value:'';}
function goTo(screen){setState({screen,error:null,expandedQDot:null});}

// ─── Handlers ─────────────────────────────────────────────────────────────────
function handleSetupContinue(){const k=val('apiKeyInput').trim();if(!k){setState({error:'Please enter your Anthropic API key.'});return;}saveApiKey(k);const p=loadActiveChild(),st=loadState(p);if(st.activeTheme)applyTheme(st.activeTheme);setState({screen:'home',activeProfile:p,persistedState:st,error:null});}

function switchChild(id){const p=PROFILES[id];if(!p)return;saveActiveChild(id);const st=loadState(p);if(st.activeTheme)applyTheme(st.activeTheme);setState({activeProfile:p,persistedState:st,screen:'home',error:null,levelAnnouncements:[],newBadges:[]});}

function handleStartNew(){const t=val('topicInput').trim();if(!t){alert('Type a character and setting idea first!');return;}startSession(t,false);}

async function startSession(topicInput,isContinuation){
  const p=S.activeProfile,st=S.persistedState,today=new Date();
  const format=getFormatForDate(today),domain=p.mathDomains[st.mathDomainIndex%p.mathDomains.length],lesson=LIFE_LESSONS[st.lifeLessonIndex%LIFE_LESSONS.length];
  const wordLength=st.storyWordLength||p.defaultStoryWords;
  const topicFinal=isContinuation&&st.lastStorySummary?`Continue the previous story. Summary: ${st.lastStorySummary}`:topicInput;
  const numQ=st.numQuestions||p.numQuestions;
  setState({screen:'loading',loadingMsg:'Writing your story…',format,lifeLesson:lesson,mathDomain:domain,topic:{raw:topicInput,choice:null},sessionDate:today.toDateString(),score:0,currentQ:0,answers:[],wrongAttempts:[],questions:null,firstPart:null,continuation:null,fullStory:null,hintLevel:0,showFullAnswer:false,correctFeedback:null,clarifyVisible:false,clarifyText:'',clarifyResponse:null,reviewScore:null,reviewReadingLevel:null,reviewMathLevel:null,error:null,expandedQDot:null,numQ});
  try{
    const story=await callClaude([{role:'user',content:buildStoryPrompt({format,profile:p,readingLevel:st.readingLevel,mathLevel:st.mathLevel,mathDomain:domain,lifeLesson:lesson,topic:topicFinal,storySummary:isContinuation?st.lastStorySummary:null,wordLength,heroName:st.heroName})}],'You are a skilled children\'s fiction writer.',3000);
    if(format==='Choose-Your-Path')setState({screen:'story-cyp',firstPart:story});
    else setState({screen:'story-detective',fullStory:story});
  }catch(err){setState({screen:'home',error:`Story failed: ${err.message}`});}
}

function handleOptionChoice(choice){S.topic={...(S.topic||{}),choice};generateContinuation(choice);}
async function generateContinuation(choice){
  setState({screen:'continuation-loading'});
  const p=S.activeProfile,st=S.persistedState;
  try{const cont=await callClaude([{role:'user',content:buildContinuationPrompt({firstPart:S.firstPart,choice,profile:p,readingLevel:st.readingLevel,mathLevel:st.mathLevel,mathDomain:S.mathDomain,lifeLesson:S.lifeLesson,wordLength:st.storyWordLength||p.defaultStoryWords})}],'You are a skilled children\'s fiction writer.',1800);
  setState({screen:'continuation',continuation:cont,fullStory:(S.firstPart||'')+'\n\n'+cont});}
  catch(err){setState({screen:'story-cyp',error:`Continuation failed: ${err.message}`});}
}

async function handleReadyForQuestions(){
  setState({screen:'loading',loadingMsg:'Generating questions…'});
  const p=S.activeProfile,st=S.persistedState;
  try{
    const numQ=S.numQ||p.numQuestions;
    const raw=await callClaude([{role:'user',content:buildQuestionsPrompt({story:S.fullStory,mathDomain:S.mathDomain,lifeLesson:S.lifeLesson,profile:p,readingLevel:st.readingLevel,numQ})}],'You are a reading comprehension teacher. Return only valid JSON.',2500);
    let qs;
    try{qs=JSON.parse(raw.replace(/```json\n?/g,'').replace(/```\n?/g,'').trim());}
    catch{throw new Error('Could not parse questions. Please retry.');}
    if(!Array.isArray(qs)||qs.length<numQ)throw new Error(`Got fewer than ${numQ} questions. Please retry.`);
    setState({screen:'questions',questions:qs.slice(0,numQ),currentQ:0,score:0,answers:[],wrongAttempts:[],hintLevel:0,showFullAnswer:false,correctFeedback:null,expandedQDot:null});
  }catch(err){setState({screen:S.format==='Choose-Your-Path'?'continuation':'story-detective',error:`Question generation failed: ${err.message}`});}
}

async function handleSubmitAnswer(){
  const answer=val('answerInput').trim();
  if(!answer)return;
  const qs=S.questions,qi=S.currentQ,q=qs[qi],hl=S.hintLevel||0;

  // After hint 3, they can still submit and get credit
  setState({gradingLoading:true,gradingError:null});
  try{
    const correct=await gradeAnswer(q.q,answer,q.acceptable_variants||[q.full_answer],q.full_answer,q.type==='math');
    setState({gradingLoading:false});
    if(correct){
      const pts=pointsForAnswer(true,hl);
      const trail=S.persistedState?.avatarEquipped?.trail;
      setState({gradingLoading:false,correctFeedback:{points:pts,trail}});
      if(trail&&AV_TRAIL[trail])spawnTrail(AV_TRAIL[trail].particles);
      setTimeout(()=>finalizeQuestion(true,answer),1600);
      return;
    }else{
      // Keep wrong answer visible, advance hint
      const newWrong=[...(S.wrongAttempts||[]),answer];
      const newHL=Math.min(hl+1,3);
      setState({wrongAttempts:newWrong,hintLevel:newHL});
      if(newHL>=3&&hl>=3){
        // Already at hint 3 and still wrong — they've been here; let them keep trying or show answer
        // (no auto-fail; they choose to show answer themselves)
      }
    }
  }catch(err){setState({gradingLoading:false,gradingError:`Grading error: ${err.message}`});}
}

function finalizeQuestion(correct,userAnswer){
  const hl=S.hintLevel||0,pts=pointsForAnswer(correct,hl);
  const newAnswers=[...(S.answers||[]),{correct,hintsUsed:hl,userAnswer,pointsEarned:pts}];
  const newScore=S.score+(correct?1:0);
  const nextQ=S.currentQ+1,isLast=nextQ>=(S.questions||[]).length;
  if(isLast)setState({answers:newAnswers,score:newScore,screen:'wrapup',currentQ:nextQ,correctFeedback:null});
  else setState({answers:newAnswers,score:newScore,currentQ:nextQ,hintLevel:0,showFullAnswer:false,wrongAttempts:[],clarifyVisible:false,clarifyText:'',clarifyResponse:null,gradingError:null,expandedQDot:null,correctFeedback:null});
}
function spawnTrail(particles){
  for(let i=0;i<10;i++){
    const el=document.createElement('div');
    el.className='trail-particle';
    el.textContent=particles[Math.floor(Math.random()*particles.length)];
    const x=15+Math.random()*70;
    const y=30+Math.random()*40;
    el.style.cssText=`left:${x}vw;top:${y}vh;--tx:${(Math.random()-.5)*60}px;--ty:${-30-Math.random()*60}px;animation-delay:${i*0.07}s;`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),1400);
  }
}

async function handleClarify(){
  const text=val('clarifyInput').trim();if(!text)return;
  const q=(S.questions||[])[S.currentQ];
  setState({clarifyLoading:true,clarifyText:text});
  try{const resp=await callClaude([{role:'user',content:buildClarifyPrompt(S.fullStory,q.q,text,S.activeProfile)}],'You are a helpful tutor.',400);setState({clarifyLoading:false,clarifyResponse:resp});}
  catch(err){setState({clarifyLoading:false,clarifyResponse:`Error: ${err.message}`});}
}

// ─── Confirm Save — save FIRST, then update summary in background ──────────────
async function handleConfirmSave(){
  const p=S.activeProfile,st=S.persistedState;
  const score=S.reviewScore!==null?S.reviewScore:S.score;
  const rrl=S.reviewReadingLevel!==null?S.reviewReadingLevel:st.readingLevel;
  const rml=S.reviewMathLevel!==null?S.reviewMathLevel:st.mathLevel;
  const numQ=S.numQ||p.numQuestions;
  const{changes,announcements,meta}=computeLevelChanges({...st,readingLevel:rrl,mathLevel:rml},score,numQ,p.name);

  const todayStr=S.sessionDate||new Date().toDateString();

  // Consecutive streak
  let streak=st.consecutiveStreak||0;
  if(!st.lastSessionDate){streak=1;}
  else if(st.lastSessionDate!==todayStr){
    const diff=Math.round((new Date(todayStr)-new Date(st.lastSessionDate))/86400000);
    streak=diff===1?streak+1:1;
  }
  // else same day — don't change streak

  const sessToday=st.lastSessionDate===todayStr?(st.sessionsCompletedToday||0)+1:1;
  const sessionPts=(S.answers||[]).reduce((s,a)=>s+(a.pointsEarned||0),0)+5;
  const newPoints=(st.points||0)+sessionPts;
  const domainCounts={...(st.domainCounts||{})};
  domainCounts[S.mathDomain]=(domainCounts[S.mathDomain]||0)+1;
  const detectiveCount=(st.detectiveCount||0)+(S.format==='Detective'?1:0);
  const cypCount=(st.cypCount||0)+(S.format==='Choose-Your-Path'?1:0);
  const allNoHint=(S.answers||[]).every(a=>(a.hintsUsed||0)===0);
  const hadComeback=(S.answers||[]).some((a,i)=>!a.correct&&(S.answers||[]).slice(i+1).some(b=>b.correct));
  const perfectSessions=(st.perfectSessions||0)+(score===numQ&&allNoHint?1:0);

  const sessionEntry={
    date:todayStr,format:S.format,domain:S.mathDomain,
    score,total:numQ,pointsEarned:sessionPts,
    allNoHint,hadComeback,readingLevelUp:meta.readingLevelUp,mathLevelUp:meta.mathLevelUp,
    questions:(S.questions||[]).map((q,i)=>{const a=(S.answers||[])[i]||{};return{q:q.q,type:q.type,correct:!!a.correct,hintsUsed:a.hintsUsed||0,userAnswer:a.userAnswer||'',fullAnswer:q.full_answer};}),
  };

  const newHistory=[...(st.sessionHistory||[]),sessionEntry].slice(-30);

  // Build new state
  const newState={
    ...st,...changes,
    lifeLessonIndex:(st.lifeLessonIndex+1)%LIFE_LESSONS.length,
    mathDomainIndex:(st.mathDomainIndex+1)%p.mathDomains.length,
    lastSessionDate:todayStr,sessionsCompletedToday:sessToday,
    consecutiveStreak:streak,domainCounts,detectiveCount,cypCount,
    perfectSessions,points:newPoints,sessionHistory:newHistory,
    lastStorySummary:st.lastStorySummary||'',
  };

  // Check badges against new state
  const newBadgeIds=checkBadges({...newState,points:newPoints},sessionEntry);
  newState.badges=[...(st.badges||[]),...newBadgeIds];

  // *** SAVE IMMEDIATELY — before any async operations ***
  saveState(p,newState);
  setState({persistedState:newState,screen:'home',levelAnnouncements:announcements,newBadges:newBadgeIds,error:null});

  // Update story summary in background — won't block anything
  callClaude([{role:'user',content:buildSummaryPrompt(S.fullStory||'')}],'You write brief story summaries.',300)
    .then(summary=>{
      const updated={...newState,lastStorySummary:summary};
      saveState(p,updated);
      S.persistedState=updated; // update in memory without re-render
    })
    .catch(()=>{}); // silently ignore — summary is non-critical
}

function handleSaveNumQ(){
  const v=parseInt(val('numQInput'),10);
  if(!v||v<3||v>10)return;
  const ns={...S.persistedState,numQuestions:v};
  saveState(S.activeProfile,ns);
  setState({persistedState:ns});
  alert(`Questions per session set to ${v} for ${S.activeProfile.name}.`);
}

function handleBuyAvItem(itemId){
  const item=avItemById(itemId);if(!item)return;
  const st=S.persistedState;
  if((st.points||0)<item.cost){alert('Not enough points!');return;}
  const slot=avSlotOf(itemId);
  const newEq={...(st.avatarEquipped||{})}; newEq[slot]=itemId;
  const ns={...st,points:(st.points||0)-item.cost,unlockedItems:[...(st.unlockedItems||[]),itemId],avatarEquipped:newEq};
  saveState(S.activeProfile,ns);setState({persistedState:ns});
}

function handleEquipAvItem(slot,itemId){
  const st=S.persistedState;
  const newEq={...(st.avatarEquipped||{})};
  newEq[slot]=itemId||null;
  const ns={...st,avatarEquipped:newEq};
  saveState(S.activeProfile,ns);setState({persistedState:ns});
}

function handleSaveWordLength(){
  const v=parseInt(val('wordLengthSlider'),10);
  if(!v||v<400||v>1200)return;
  const ns={...S.persistedState,storyWordLength:v};
  saveState(S.activeProfile,ns);
  setState({persistedState:ns});
  alert(`Story length saved: ${v} words.`);
}

function handleBuyItem(itemId){
  const p=S.activeProfile,st=S.persistedState,items=STORE[p.id]||[],item=items.find(i=>i.id===itemId);
  if(!item)return;
  if((st.points||0)<item.cost){alert('Not enough points!');return;}
  const ns={...st,points:(st.points||0)-item.cost,unlockedItems:[...(st.unlockedItems||[]),itemId]};
  saveState(p,ns);setState({persistedState:ns});
}

function handleUseTheme(themeId){
  const id=themeId==='default'?null:themeId;
  const ns={...S.persistedState,activeTheme:id};
  saveState(S.activeProfile,ns);applyTheme(id||'default');setState({persistedState:ns});
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function extractOption(text,letter){const re=new RegExp(`Option\\s+${letter}[:\\s]+(.+?)(?=Option\\s+[AB]|$)`,'is');const m=text.match(re);return m?m[1].trim().replace(/\n/g,' ').slice(0,220):null;}
function eh(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/\n/g,'<br>');}
function ea(s){if(!s)return'';return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/\n/g,' ');}

// ─── Boot ─────────────────────────────────────────────────────────────────────
(function boot(){
  const key=loadApiKey();
  if(key){const p=loadActiveChild(),st=loadState(p);S.activeProfile=p;S.persistedState=st;S.screen='home';if(st.activeTheme)applyTheme(st.activeTheme);}
  render();
})();
</script>
</body>
